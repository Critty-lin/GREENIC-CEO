name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "review.html"
      - "config.js"
      - "guide.html"
      - "robots.txt"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Pages and configure
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html review.html guide.html config.js robots.txt .nojekyll _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub 的 artifact 索引偶尔会比上传步骤慢一拍，等几秒再部署。
      - name: Wait for artifact indexing
        run: sleep 8

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
