<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140a" />
  <title>绿色芯片CEO竞选计</title>
  <style>
    :root {
      --bg: #07140a; --panel: #0c1f10; --ink: #def5c8; --dim: #7fa36a;
      --nv: #76b900; --nv2: #4e7c00; --up: #8dff4a; --down: #ff6b57;
      --gold: #e6c35c; --line: #1d3a18; --btn: #132816;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      overflow: hidden;
    }
    body {
      background-image:
        linear-gradient(rgba(7,20,10,.92), rgba(7,20,10,.92)),
        repeating-linear-gradient(90deg, #0a1c0c 0 12px, #081609 12px 24px);
    }
    button {
      font-family: inherit;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }
    #frame {
      height: 100dvh; height: 100svh; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
      position: relative; overflow: hidden;
    }
    #frame::after {
      content: ""; pointer-events: none; position: absolute; inset: 0; z-index: 8;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px);
    }
    .hud {
      flex: 0 0 auto; border: 3px solid var(--nv); background: #061108;
      padding: 8px 10px 7px; box-shadow: 4px 4px 0 #031006;
    }
    .hud-top { display: flex; align-items: center; gap: 8px; }
    .price-block { min-width: 0; flex: 1; }
    .price-label { font-size: 10px; letter-spacing: .14em; color: var(--nv); }
    .price { font-size: 22px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
    .price.up { color: var(--up); }
    .price.down { color: var(--down); }
    .price.flash { animation: pulse .35s steps(2); }
    .delta { font-size: 12px; margin-left: 4px; }
    #spark { width: 108px; height: 36px; flex: 0 0 auto; image-rendering: pixelated; background: #040a05; border: 2px solid var(--line); }
    .hud-bot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
    .stat b { display: block; color: var(--ink); font-size: 14px; }
    .bar { height: 6px; background: #12210f; border: 1px solid var(--line); margin-top: 3px; }
    .bar > i { display: block; height: 100%; width: 50%; background: var(--nv); }
    .news-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .news { flex: 1; min-width: 0; font-size: 11px; color: var(--nv); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mute, .lock-btn {
      flex: 0 0 auto; min-height: 32px; min-width: 44px; border: 2px solid var(--line);
      background: #061108; color: var(--dim); font-size: 12px; font-weight: 700;
      padding: 4px 8px; cursor: pointer; text-align: center;
    }
    .lock-btn { border-color: var(--gold); color: var(--gold); }
    #stage {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      margin: 10px 0 8px; border: 3px solid var(--line); background: var(--panel);
      padding: 12px; position: relative;
    }
    #choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .scene-kicker { font-size: 10px; letter-spacing: .16em; color: var(--gold); }
    h1, h2 { margin: 6px 0 8px; line-height: 1.25; }
    h1 { font-size: 24px; color: var(--nv); text-shadow: 3px 3px 0 #102406; }
    h2 { font-size: 18px; }
    .hero-wrap { display: flex; gap: 12px; align-items: flex-start; margin: 8px 0 12px; }
    .hero, .hero.lg {
      image-rendering: pixelated; image-rendering: crisp-edges;
      width: 84px; height: 105px; flex: 0 0 84px;
      background: #08150b; border: 3px solid var(--nv); object-fit: fill;
      margin-top: 26px;
    }
    .album { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .cell {
      border: 3px solid var(--line); background: #08150b; padding: 8px 6px 10px;
      text-align: center; min-height: 148px;
    }
    .cell img {
      width: 84px; height: 105px; image-rendering: pixelated; border: 3px solid var(--nv);
      margin: 0 auto 6px; display: block; background: #061108;
    }
    .cell.lock { opacity: .38; filter: grayscale(1); }
    .cell b { display: block; font-size: 12px; color: var(--gold); }
    .cell span { display: block; font-size: 11px; color: var(--dim); margin-top: 4px; }
    .body { font-size: 15px; line-height: 1.55; }
    .hint { margin-top: 8px; color: var(--dim); font-size: 12px; line-height: 1.5; }
    .choice, .go, .mem, .face {
      appearance: none; width: 100%; text-align: center; background: var(--btn); color: var(--ink);
      border: 3px solid var(--nv); padding: 12px 10px; min-height: 48px; font-size: 15px; line-height: 1.35;
      cursor: pointer; box-shadow: 3px 3px 0 #031006; overflow-wrap: anywhere; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .go { background: #16380c; }
    #choices.many .choice, #choices.many .go, .faces .face, #overlay.many .choice, #overlay.many .go {
      justify-content: flex-start; text-align: left;
    }
    .ghost { background: #0a160c; border-color: var(--line); color: var(--dim); }
    .choice:active, .go:active { transform: translate(2px, 2px); }
    .choice:focus-visible, .go:focus-visible, .mem:focus-visible, .face:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .key { display: inline-block; min-width: 18px; margin-right: 8px; color: var(--nv); font-weight: 800; }
    .floaters { pointer-events: none; position: fixed; left: 0; top: 0; right: 0; z-index: 12; }
    .floater { position: absolute; font-weight: 800; font-size: 16px; animation: rise .9s steps(8) forwards; text-shadow: 2px 2px 0 #000; }
    .floater.up { color: var(--up); }
    .floater.down { color: var(--down); }
    .toast {
      position: absolute; left: 10px; right: 10px; bottom: 10px; background: #10240c;
      border: 2px solid var(--gold); padding: 8px 10px; font-size: 12px; color: var(--gold); z-index: 4;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip { font-size: 10px; border: 2px solid var(--line); padding: 3px 6px; color: var(--dim); }
    .chip.out { opacity: .35; text-decoration: line-through; }
    .end-line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 2px solid var(--line); }
    .score-pop { font-size: 28px; color: var(--gold); font-weight: 800; margin: 8px 0; }
    .badge {
      display: inline-block; margin: 8px 0 4px; padding: 6px 10px;
      border: 3px solid var(--gold); color: var(--gold); font-size: 13px; font-weight: 700;
      letter-spacing: .04em;
    }
    .apply {
      background: #0a1408; border: 3px solid #76b900; padding: 12px;
    }
    .apply .brand { color: var(--nv); font-size: 12px; letter-spacing: .2em; }
    .apply .job { font-size: 18px; margin: 6px 0 4px; }
    .apply .meta { color: var(--dim); font-size: 12px; line-height: 1.6; }
    .ok-anim { text-align: center; padding: 18px 8px; }
    .ok-anim .check {
      width: 56px; height: 56px; margin: 0 auto 10px; border: 4px solid var(--nv);
      display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--nv);
      animation: pop .35s steps(3);
    }
    .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--nv); border-right-color: transparent; animation: spin .7s steps(8) infinite; vertical-align: middle; }
    .arena {
      position: relative; height: 168px; overflow: hidden; background: #08150b;
      border: 3px solid var(--line); margin-top: 8px;
    }
    .dm {
      position: absolute; white-space: nowrap; font-size: 13px; padding: 8px 10px;
      border: 3px solid var(--down); background: #2a1210; color: var(--ink); cursor: pointer;
      max-width: 88%; overflow: hidden; text-overflow: ellipsis;
      appearance: none; min-height: 40px; z-index: 1; text-align: left;
      box-shadow: 3px 3px 0 #031006;
    }
    .dm.trap { border-color: var(--nv); background: #10240c; color: #c8f090; }
    .dm.hit { background: var(--nv); color: #08150b; }
    .dm.miss { background: var(--down); color: #fff; }
    .quote-bar { margin-top: 8px; font-size: 12px; color: var(--gold); }
    .track { position: relative; height: 36px; background: #08150b; border: 3px solid var(--line); overflow: hidden; margin: 12px 0 8px; }
    .zone { position: absolute; top: 0; bottom: 0; background: rgba(118,185,0,.38); }
    .needle { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--gold); }
    .seq { font-size: 22px; text-align: center; color: var(--nv); min-height: 40px; margin: 12px 0; letter-spacing: .08em; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mem.ok { background: var(--nv); color: #08150b; animation: pop .28s steps(3); }
    .mem.bad { background: var(--down); border-color: var(--down); color: #fff; animation: pulse .3s steps(2); }
    .seq.ok { color: var(--up); }
    .seq.bad { color: var(--down); }
    .fx {
      position: absolute; font-weight: 800; font-size: 14px; pointer-events: none;
      animation: rise .65s steps(6) forwards; text-shadow: 2px 2px 0 #000; z-index: 3;
    }
    .fx.up { color: var(--up); }
    .fx.down { color: var(--down); }
    .cndl.ok { outline: 3px solid var(--up); }
    .cndl.bad { outline: 3px solid #fff; }
    .faces { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .face {
      border-color: var(--line); background: #10240c; min-height: 64px;
    }
    .face.on { border-color: var(--nv); }
    .face.lock { border-color: var(--gold); color: var(--gold); }
    .face.dead { opacity: .4; pointer-events: none; }
    .candles { position: relative; height: 150px; overflow: hidden; background: #08150b; border: 3px solid var(--line); margin-top: 8px; }
    .cndl {
      position: absolute; width: 22px; cursor: pointer; border: 2px solid #000;
    }
    .cndl.red { background: var(--down); }
    .cndl.green { background: var(--nv); }
    #overlay {
      position: absolute; inset: 0; z-index: 9; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(0,0,0,.72);
    }
    #overlay.on { display: flex; }
    .modal { width: 100%; }
    .sheet {
      width: 100%; background: #0c1a0c; border: 3px solid var(--gold); padding: 14px;
      box-shadow: 6px 6px 0 #031006;
    }
    .sheet h3 { margin: 0 0 8px; color: var(--gold); font-size: 16px; }
    .progress { height: 10px; background: #12210f; border: 2px solid var(--line); margin: 10px 0; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--gold); }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
    @keyframes pop { from { transform: scale(.4); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-width: 800px) {
      #frame {
        margin-top: 18px; height: calc(100dvh - 36px); border: 4px solid #1a3d12;
        box-shadow: 0 0 0 8px #040a05, 12px 12px 0 #031006;
      }
    }
    @media (max-height: 700px) {
      .hero, .hero.lg { width: 84px; height: 105px; flex-basis: 84px; }
      h1 { font-size: 20px; }
      .body { font-size: 14px; }
      .arena, .candles { height: 132px; }
      .price { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .price.flash, .floater, .ok-anim .check, .spin { animation: none; }
    }
  </style>
</head>
<body>

      dm: { items: [], raf: 0, t0: 0, hits: 0, miss: 0, running: false },

    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, vol) {
      if (state.muted) return;
      try {
        const a = ctx(), o = a.createOscillator(), g = a.createGain();
        o.type = type || "square"; o.frequency.value = freq; g.gain.value = vol || 0.045;
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
      } catch (_) {}
    }

      if (k === "click") tone(880, 0.06);
      if (k === "up") { tone(440, 0.08); setTimeout(() => tone(659, 0.1), 90); }

      if (k === "ok") { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.1), i * 80)); }

    function drawHero(kind) {

        leather: ["#0000", "#141414", "#f0c090", "#3a2418", "#1a120e", "#3d2a1c"],
        crisis: ["#0000", "#141414", "#f0c090", "#3a2418", "#5a1812", "#c44538"],
        bubble: ["#0000", "#141414", "#f0c090", "#3a2418", "#5a4a10", "#e6c35c"],
        stolen: ["#0000", "#141414", "#f0c090", "#3a2418", "#2a2a2a", "#7a7a7a"],
        crash: ["#0000", "#141414", "#f0c090", "#3a2418", "#3a1512", "#ff6b57"],
        fail: ["#0000", "#141414", "#f0c090", "#3a2418", "#2a2a20", "#8a8a70"],
        almost: ["#0000", "#141414", "#f0c090", "#3a2418", "#3d6a00", "#e6c35c"],
        advisor: ["#0000", "#141414", "#f0c090", "#3a2418", "#1a3030", "#6aaaa0"],
        quit: ["#0000", "#141414", "#f0c090", "#3a2418", "#3a3a3a", "#8a8a8a"]
      };
      const pal = pals[kind] || pals.default;
      const c = document.createElement("canvas");
      c.width = 16; c.height = 20;
      const g = c.getContext("2d");
      HERO.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
          const ch = row[x];
          if (ch === ".") continue;
          g.fillStyle = pal[Number(ch)] || pal[1];
          g.fillRect(x, y, 1, 1);
        }
      });
      if (kind === "leather") {
        g.fillStyle = "#1a120e";
        g.fillRect(3, 8, 10, 1);
        g.fillStyle = "#c4a070";
        for (let y = 9; y <= 15; y++) g.fillRect(8, y, 1, 1);
      }
      if (kind === "bubble") {
        g.fillStyle = "#e6c35c";
        g.fillRect(5, 0, 6, 1);
        g.fillRect(4, 1, 8, 1);
        g.fillRect(6, 0, 1, 2);
        g.fillRect(9, 0, 1, 2);
      }
      if (kind === "crisis") {
        g.fillStyle = "#ff6b57";
        g.fillRect(2, 11, 4, 2);
      }
      if (kind === "advisor") {
        g.fillStyle = "#e6c35c";
        g.fillRect(10, 12, 2, 2);
      }
      if (kind === "stolen") {
        g.fillStyle = "#e6c35c";
        g.fillRect(6, 11, 4, 3);

      if (kind === "crash") {

      og.fillStyle = "#08150b";

      og.drawImage(c, 0, 0, 16, 16, 12, 12, 96, 126);

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    }

    function drawSpark() {
      const c = $("spark"), g = c.getContext("2d"), w = c.width, h = c.height;
      g.fillStyle = "#040a05"; g.fillRect(0, 0, w, h);
      const data = state.hist.slice(-18);
      const min = Math.min.apply(null, data) - 1, max = Math.max.apply(null, data) + 1;
      g.beginPath();
      data.forEach((v, i) => {
        const x = (i / Math.max(1, data.length - 1)) * (w - 4) + 2;
        const y = h - 3 - ((v - min) / (max - min)) * (h - 6);
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      });
      g.strokeStyle = state.stock >= OPEN ? "#76b900" : "#ff6b57";
      g.lineWidth = 2; g.stroke();
    }
    function floatAt(text, up, x, y) {
      const el = document.createElement("div");
      el.className = "floater " + (up ? "up" : "down");
      el.textContent = text;
      el.style.left = (x || 40) + "px"; el.style.top = (y || 70) + "px";
      $("floaters").appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
    function bumpStock(d, news, silent) {
      const prev = state.stock;
      state.stock = clamp(state.stock + d, 42, 260);
      state.hist.push(state.stock); if (state.hist.length > 40) state.hist.shift();
      if (news) state.news = news;
      if (!silent && Math.abs(d) >= 0.4) {
        const hud = $("hud").getBoundingClientRect();
        floatAt((d >= 0 ? "+" : "") + d.toFixed(1), d >= 0, hud.left + 24, hud.top + 28);
        sfx(d >= 0 ? "up" : "down");
        $("price").classList.add("flash");
        setTimeout(() => $("price").classList.remove("flash"), 360);
      }
    }
    function bumpTrust(d) {
      if (!d) return;
      state.trust = clamp(state.trust + d, 0, 100);
      const hud = $("hud").getBoundingClientRect();
      floatAt((d >= 0 ? "印象+" : "印象") + d, d >= 0, hud.left + 150, hud.top + 58);
    }
    function kill(n) {
      if (n <= 0) return 0;
      const floor = (state.scene === "end" || state.scene === "quitend") ? 0 : 1;
      const count = Math.min(n, Math.max(0, state.rivals - floor));
      state.rivals -= count;
      if (count) {
        const hud = $("hud").getBoundingClientRect();
        floatAt("出局 " + count, true, hud.right - 80, hud.top + 58);

      return count;

      if (state.scene === "quitend" || state.quit) return { id: "quit", score: 120, good: false };
      const s = state.stock, t = state.trust, c = state.rivals;

      if (t >= 68 && s >= 128 && c <= 22) return { id: "ceo", score, good: true };
      if (s >= 168 && t >= 52) return { id: "bubble", score, good: true };
      if (s < 120 && t >= 50 && c <= 30) return { id: "crisis_ceo", score, good: true };
      if (t >= 52 && c <= 30) return { id: "almost", score, good: true };
      return { id: "advisor", score, good: false };

    function startDanmaku() {
      const arena = $("arena"); if (!arena) return;
      state.dm = { items: [], raf: 0, t0: 0, hits: 0, miss: 0, running: true, spawn: 0 };
      const paintDm = () => {
        const el = $("dmHint");
        if (el) el.textContent = "已删反对 " + state.dm.hits + "　误伤支持者 " + state.dm.miss + "　·　点红框，别点绿框";
      };
      const spawn = () => {
        if (!state.dm.running || !arena.isConnected) return;
        const w = arena.clientWidth || arena.offsetWidth || 320;
        if (w < 40) return;
        const good = Math.random() < 0.42;
        const pool = good ? DANMAKU_GOOD : DANMAKU_BAD;
        const text = pool[(Math.random() * pool.length) | 0];
        const el = document.createElement("button");
        el.type = "button";
        el.className = "dm" + (good ? " trap" : "");
        el.textContent = text;
        el.style.top = (6 + Math.random() * Math.max(24, arena.clientHeight - 48)) + "px";
        const x = Math.round(w * 0.28 + Math.random() * w * 0.36);
        el.style.left = x + "px";
        el.dataset.beat = good ? "0" : "1";
        el.addEventListener("pointerdown", (ev) => { ev.preventDefault(); ev.stopPropagation(); tapDm(el); });
        arena.appendChild(el);
        state.dm.items.push({ el, x: x, spd: 0.55 + Math.random() * 0.35 });
      };
      const loop = (now) => {
        if (!state.dm.running) return;
        if (!state.dm.t0) { state.dm.t0 = now; state.dm.last = now; }
        const dt = Math.min(48, now - (state.dm.last || now));
        state.dm.last = now;
        if (now - state.dm.spawn > 700) { state.dm.spawn = now; spawn(); }
        state.dm.items = state.dm.items.filter((it) => {
          if (it.el.dataset.done) return false;
          it.x -= (52 * it.spd) * (dt / 1000);
          it.el.style.left = it.x + "px";
          if (it.x < -(it.el.offsetWidth || 80) - 12) { it.el.remove(); return false; }
          return true;
        });
        if (now - state.dm.t0 > 18000) { finishDanmaku(); return; }
        state.dm.raf = requestAnimationFrame(loop);
      };
      paintDm();
      requestAnimationFrame(() => {
        spawn();
        spawn();
        paintDm();
        state.dm.raf = requestAnimationFrame(loop);
      });
      state.dm.paint = paintDm;
    }
    function tapDm(el) {
      if (!state.dm.running || el.dataset.done) return;
      el.dataset.done = "1";
      const beat = el.dataset.beat === "1";
      if (beat) { el.classList.add("hit"); state.dm.hits++; sfx("hit"); bumpTrust(1); bumpStock(0.8, null, true); kill(8); }
      else { el.classList.add("miss"); state.dm.miss++; sfx("down"); bumpTrust(-1); bumpStock(-1.4, null, true); }
      paintHud();
      if (state.dm.paint) state.dm.paint();
      setTimeout(() => { if (el.parentNode) el.remove(); }, 160);
    }
    function fireNearest() {

    function startMemory() {

      const seq = [];

      state.mem = { seq, step: 0, phase: "show", lock: false };
      const seqEl = $("seq"), grid = $("memGrid");
      let i = 0;
      const show = () => {
        if (state.scene !== "tech") return;
        if (i >= seq.length) {
          seqEl.textContent = "按顺序点";
          state.mem.phase = "tap";
          const opts = seq.slice();
          MEM_POOL.forEach((w) => { if (opts.indexOf(w) < 0 && opts.length < 6) opts.push(w); });
          opts.sort(() => Math.random() - 0.5);
          grid.innerHTML = opts.map((w) => '<button class="mem" data-act="mem" data-w="' + w + '" type="button">' + w + "</button>").join("");
          return;
        }
        seqEl.textContent = seq[i];
        i += 1;
        setTimeout(show, 700);
      };
      setTimeout(show, 400);

      }
      if (act === "quit") { sfx("lose"); state.quit = true; state.scene = "quitend"; render(); return; }
      if (act === "quote") { sfx("click"); state.quote = b.dataset.id; state.scene = "danmaku"; render(); return; }
      if (act === "skipdm") { finishDanmaku(); return; }
      if (act === "open") { fireOpen(); return; }
      if (act === "mem") { tapMem(b.dataset.w); return; }
      if (act === "catch") { gossipAct(true); return; }
      if (act === "pass") { gossipAct(false); return; }
      if (act === "vote") {
        const id = b.dataset.id; const info = BOARD.find((x) => x.id === id);
        if (!info || info.locked || state.votes[id]) return;
        sfx("hit"); state.votes[id] = true; bumpTrust(2); bumpStock(1.2, "说动了" + info.name); paintHud(); render();
        return;
      }
      if (act === "pay") {
        if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "档案已经读过了"); return; }
        sfx("click"); state.pay = "offer"; showPay(); return;
      }
      if (act === "buynow") { sfx("click"); state.pay = "buying"; showPay(); return; }
      if (act === "nopay") { sfx("click"); state.pay = "retain"; showPay(); return; }
      if (act === "giveup") { sfx("down"); state.pay = "lost"; bumpTrust(-2); bumpStock(-2.4, "你失去了价值百亿的机会"); showPay(); return; }
      if (act === "prankok") { sfx("click"); state.pay = "files"; showPay(); return; }
      if (act === "file") { sfx("click"); state.fileRead = b.dataset.id; state.pay = "file"; showPay(); return; }
      if (act === "fileok") { sfx("ok"); state.pay = "pranked"; bumpTrust(2); toast("情报已阅，没什么用"); afterPayClose(); return; }
      if (act === "memgo") { sfx("click"); hidePay(); state.mem.go = true; startMemory(); return; }
      if (act === "lostok") { afterPayClose(); return; }
      if (act === "finish") {
        const n = Object.keys(state.votes).length;
        settle({ trust: n * 2, stock: n * 1.1, kill: n >= 2 ? 1 : 0, news: "表决 说动" + n + " 席" }, "end");
      }
    });
    $("stage").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const act = b.dataset.act;
      if (act === "mem") tapMem(b.dataset.w);
      if (act === "vote" || act === "pay") {
        const ev = new Event("click", { bubbles: true });
        /* reuse choices handler by dispatching through cloning act on choices is messy; call same */
      }
      if (act === "vote") {
        const id = b.dataset.id; const info = BOARD.find((x) => x.id === id);
        if (!info || info.locked || state.votes[id]) return;
        sfx("hit"); state.votes[id] = true; bumpTrust(2); bumpStock(1.2, "说动了" + info.name); render();
      }
      if (act === "pay") {
        if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "档案已经读过了"); return; }
        sfx("click"); state.pay = "offer"; showPay();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
      if ((state.scene === "end" || state.scene === "quitend") && (e.key === "Enter" || e.key === "r")) { restart(); return; }
      if (state.scene === "title" && (e.key === "1" || e.key === "Enter")) { sfx("boom"); state.scene = "intel"; render(); return; }
      if (state.scene === "intel" && e.key === "1") { state.scene = "apply"; render(); return; }
      if (state.scene === "intel" && e.key === "2") { state.pay = "roastpick"; showPay(); return; }
      if (state.scene === "intel" && e.key === "3") { sfx("lose"); state.quit = true; state.scene = "quitend"; render(); return; }
      if (state.scene === "apply" && (e.key === "1" || e.key === "Enter")) { state.scene = "sending"; render(); return; }
      if ((state.scene || "").indexOf("intro") === 0 && e.key === "Enter") { document.querySelector("[data-act=to]")?.click(); return; }
      if ((state.scene || "").indexOf("sum") === 0 && e.key === "Enter") { document.querySelector("[data-act=to]")?.click(); return; }
      if (state.scene === "quote" && "123".indexOf(e.key) >= 0) {
        state.quote = QUOTES[+e.key - 1].id; state.scene = "danmaku"; render(); return;
      }
      if (state.scene === "danmaku" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); fireNearest(); return; }
      if (state.scene === "hr" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); fireOpen(); return; }
      if (state.scene === "campus" && e.key === "1") { gossipAct(true); return; }
      if (state.scene === "campus" && e.key === "2") { gossipAct(false); return; }
    });
    $("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted; $("muteBtn").textContent = state.muted ? "静音" : "音效"; if (!state.muted) sfx("click");
    });
    $("lockBtn").addEventListener("click", () => {
      if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "档案已经读过了"); return; }
      sfx("click"); state.pay = "offer"; showPay();
    });
    $("overlay").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const act = b.dataset.act;
      if (act === "buynow") { sfx("click"); state.pay = "buying"; showPay(); return; }
      if (act === "nopay") { sfx("click"); state.pay = "retain"; showPay(); return; }
      if (act === "giveup") { sfx("down"); state.pay = "lost"; bumpTrust(-2); bumpStock(-2.4, "你失去了价值百亿的机会"); showPay(); return; }
      if (act === "prankok") { sfx("click"); state.pay = "files"; showPay(); return; }
      if (act === "file") { sfx("click"); state.fileRead = b.dataset.id; state.pay = "file"; showPay(); return; }
      if (act === "fileok") { sfx("ok"); state.pay = "pranked"; bumpTrust(2); toast("情报已阅，没什么用"); afterPayClose(); return; }
      if (act === "memgo") { sfx("click"); hidePay(); state.mem.go = true; startMemory(); return; }
      if (act === "roastwho") { sfx("click"); state.fileRead = b.dataset.id; state.pay = "roast"; showPay(); return; }
      if (act === "roastok") { sfx("ok"); bumpTrust(1); bumpStock(-0.8, "gooola 锐评已发出"); hidePay(); state.scene = "apply"; render(); return; }
      if (act === "lostok") { afterPayClose(); return; }
    });

    setInterval(() => {
      if (state.scene === "end" || state.scene === "quitend" || state.scene === "title" || state.scene === "album" || state.scene === "help" || state.scene === "apply" || state.scene === "sending") {
        bumpStock((Math.random() - 0.48) * 0.3, null, true); paintHud(); return;
      }
      bumpStock((Math.random() - 0.5) * 0.55 + state.sentiment, null, true); paintHud();
    }, 1600);

    try { render(); window.asteamPreview && window.asteamPreview.ready && window.asteamPreview.ready(); }
    catch (err) { window.asteamPreview && window.asteamPreview.fail && window.asteamPreview.fail(String(err && err.message || err)); }
  })();
  </script>
</body>
</html>
