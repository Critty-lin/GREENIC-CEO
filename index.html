<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140a" />
  <title>英伟达CEO竞选计</title>
  <style>
    :root {
      --bg: #07140a;
      --panel: #0c1f10;
      --ink: #def5c8;
      --dim: #7fa36a;
      --nv: #76b900;
      --nv2: #4e7c00;
      --up: #8dff4a;
      --down: #ff6b57;
      --gold: #e6c35c;
      --line: #1d3a18;
      --btn: #132816;
      --danger: #3a1512;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      overflow: hidden;
    }
    body {
      background-image:
        linear-gradient(rgba(7,20,10,.92), rgba(7,20,10,.92)),
        repeating-linear-gradient(90deg, #0a1c0c 0 12px, #081609 12px 24px),
        repeating-linear-gradient(0deg, transparent 0 7px, rgba(118,185,0,.05) 7px 8px);
    }
    button { font-family: inherit; }
    #frame {
      height: 100dvh;
      height: 100svh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
      position: relative;
      overflow: hidden;
    }
    #frame::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px);
      z-index: 8;
    }
    .hud {
      flex: 0 0 auto;
      border: 3px solid var(--nv);
      background: #061108;
      padding: 8px 10px 7px;
      box-shadow: 4px 4px 0 #031006;
    }
    .hud-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .price-block { min-width: 0; flex: 1; }
    .price-label {
      font-size: 10px;
      letter-spacing: .14em;
      color: var(--nv);
    }
    .price {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.1;
      white-space: nowrap;
    }
    .price.up { color: var(--up); }
    .price.down { color: var(--down); }
    .price.flash { animation: pulse .35s steps(2); }
    .delta {
      font-size: 12px;
      margin-left: 4px;
    }
    #spark {
      width: 108px;
      height: 36px;
      flex: 0 0 auto;
      image-rendering: pixelated;
      background: #040a05;
      border: 2px solid var(--line);
    }
    .hud-bot {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 7px;
      font-size: 11px;
      color: var(--dim);
    }
    .stat b {
      display: block;
      color: var(--ink);
      font-size: 14px;
      letter-spacing: .03em;
    }
    .bar {
      height: 6px;
      background: #12210f;
      border: 1px solid var(--line);
      margin-top: 3px;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 50%;
      background: var(--nv);
      box-shadow: 4px 0 0 var(--nv2);
    }
    #stage {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 10px 0 8px;
      border: 3px solid var(--line);
      background: var(--panel);
      padding: 12px 12px 10px;
      position: relative;
    }
    .scene-kicker {
      font-size: 10px;
      letter-spacing: .16em;
      color: var(--gold);
      text-transform: uppercase;
    }
    h1, h2 { margin: 6px 0 8px; line-height: 1.25; }
    h1 { font-size: 26px; color: var(--nv); letter-spacing: .06em; text-shadow: 3px 3px 0 #102406; }
    h2 { font-size: 18px; }
    .who {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 8px 0 10px;
    }
    .portrait {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      image-rendering: pixelated;
      background: #08150b;
      border: 3px solid var(--nv2);
    }
    .body {
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
    }
    .hint {
      margin-top: 10px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.5;
    }
    .crisis #stage {
      border-color: var(--down);
      animation: warn 1s steps(2) infinite;
    }
    #choices {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choice, .go {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--btn);
      color: var(--ink);
      border: 3px solid var(--nv);
      padding: 12px 12px;
      min-height: 48px;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: 3px 3px 0 #031006;
      overflow-wrap: anywhere;
    }
    .go { text-align: center; background: #16380c; font-size: 16px; letter-spacing: .08em; }
    .choice:active, .go:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #031006; }
    .choice:focus-visible, .go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .key {
      display: inline-block;
      min-width: 18px;
      margin-right: 8px;
      color: var(--nv);
      font-weight: 800;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .go { flex: 1; }
    .ghost {
      background: #0a160c;
      border-color: var(--line);
      color: var(--dim);
    }
    .news-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .mute {
      flex: 0 0 auto;
      min-width: 44px;
      min-height: 32px;
      border: 2px solid var(--line);
      background: #061108;
      color: var(--dim);
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .floaters { pointer-events: none; position: fixed; left: 0; top: 0; right: 0; z-index: 12; }
    .floater {
      position: absolute;
      font-weight: 800;
      font-size: 16px;
      animation: rise .9s steps(8) forwards;
      text-shadow: 2px 2px 0 #000;
    }
    .floater.up { color: var(--up); }
    .floater.down { color: var(--down); }
    .toast {
      position: absolute;
      left: 10px; right: 10px; bottom: 10px;
      background: #10240c;
      border: 2px solid var(--gold);
      padding: 8px 10px;
      font-size: 12px;
      color: var(--gold);
      animation: in .2s steps(2);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .chip {
      font-size: 10px;
      border: 2px solid var(--line);
      padding: 3px 6px;
      color: var(--dim);
    }
    .chip.out { opacity: .35; text-decoration: line-through; }
    .end-box { margin-top: 8px; }
    .end-line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 2px solid var(--line); }
    .score-pop { font-size: 28px; color: var(--gold); font-weight: 800; margin: 8px 0; }
    .news {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--nv);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
    @keyframes warn { 50% { box-shadow: inset 0 0 0 2px var(--down); } }
    @keyframes in { from { transform: scale(.96); opacity: 0; } }
    @media (min-width: 800px) {
      #frame {
        margin-top: 18px;
        height: calc(100dvh - 36px);
        border: 4px solid #1a3d12;
        background: #07140a;
        box-shadow: 0 0 0 8px #040a05, 12px 12px 0 #031006;
      }
      h1 { font-size: 30px; }
    }
    @media (max-height: 700px) {
      .portrait { width: 56px; height: 56px; flex-basis: 56px; }
      h1 { font-size: 22px; }
      h2 { font-size: 16px; }
      .body { font-size: 14px; }
      .price { font-size: 18px; }
      #spark { width: 88px; height: 30px; }
      .choice, .go { padding: 10px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .price.flash, .crisis #stage, .floater, .toast { animation: none; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <header class="hud" id="hud">
      <div class="hud-top">
        <div class="price-block">
          <div class="price-label">NVDA 现价</div>
          <div class="price" id="price">$138.40 <span class="delta" id="delta">+0.00</span></div>
        </div>
        <canvas id="spark" width="108" height="36" aria-hidden="true"></canvas>
      </div>
      <div class="hud-bot">
        <div class="stat">对手剩余<b id="rivals">9</b></div>
        <div class="stat">董事会印象<b id="trust">50</b><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat">进度<b id="round">开局</b></div>
      </div>
      <div class="news-row">
        <div class="news" id="news">盘前等待开盘 · 海选通道已打开</div>
        <button class="mute" id="muteBtn" type="button" aria-label="音效开关">音效</button>
      </div>
    </header>
    <main id="stage"></main>
    <div id="choices"></div>
  </div>
  <div class="floaters" id="floaters"></div>
  <script>
  (function () {

    const OPEN = 138.4;
    const NAMES = ["Max", "Lisa", "Kai", "林博", "Rex", "Nova", "钱总", "Cloud", "匿名"];
    const SPRITE = {
      xun: "0001111000000112221100012333321001234443210123444431012344443101232223210012111121001111111100110100100",
      npc: "00011110000012222110012333321001235553210123555321012355532101232222310012111121001111111100110100100",
      gpu: "111111111111444444411144000044114404404411440000441144444444114400004411440440441144000044111111111111"

    const STORY = {

        name: "xunxun",
        body: "你是 xunxun。英伟达正在海选下一任 CEO。你要从投简历走到任命，途中会遇见面试、职场局，还有一只不肯停的股价。",

        choices: [

          { key: "2", text: "只附 CUDA 优化实录，不写形容词", trust: 12, stock: 0.6, kill: 1, news: "技术派被一份冷冰冰的内核记录震了一下", next: "hr" },
          { key: "3", text: "只丢一句：我想当 CEO", trust: -4, stock: -1.8, kill: 0, news: "一句空话进了海选箱，盘口轻轻晃了一下", next: "hr" }
        ]
      },
      hr: {

          { key: "3", text: "我就是来赢的", trust: 2, stock: 0.9, kill: 0, news: "气势有了，对手一动不动", next: "crisis" }

      },
      crisis: {

      news: "盘前等待开盘 · 海选通道已打开",
      lastDelta: 0
    };

    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, vol) {
      if (state.muted) return;
      try {
        const a = ctx();
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = type || "square";
        o.frequency.value = freq;
        g.gain.value = vol || 0.045;
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + dur);
      } catch (_) {}
    }
    function sfx(kind) {
      if (kind === "click") tone(880, 0.06);
      if (kind === "up") { tone(440, 0.08); setTimeout(() => tone(554, 0.08), 70); setTimeout(() => tone(659, 0.1), 140); }
      if (kind === "down") { tone(330, 0.08); setTimeout(() => tone(247, 0.1), 80); }
      if (kind === "kill") { tone(196, 0.12, "sawtooth", 0.03); setTimeout(() => tone(98, 0.18, "square", 0.04), 90); }
      if (kind === "win") { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.12), i * 90)); }
      if (kind === "lose") { tone(174, 0.2, "triangle", 0.05); setTimeout(() => tone(110, 0.28), 120); }
    }

    function drawSprite(kind) {
      const map = SPRITE[kind] || SPRITE.xun;
      const pal = PAL[kind] || PAL.xun;
      const c = document.createElement("canvas");
      c.width = 11; c.height = 14;
      const g = c.getContext("2d");
      for (let i = 0; i < map.length; i++) {
        const ch = map[i];
        if (ch === "0") continue;
        g.fillStyle = pal[Number(ch)] || pal[1];
        g.fillRect(i % 11, (i / 11) | 0, 1, 1);
      }
      const out = document.createElement("canvas");
      out.width = 72; out.height = 72;
      const og = out.getContext("2d");
      og.imageSmoothingEnabled = false;
      og.fillStyle = "#08150b";
      og.fillRect(0, 0, 72, 72);
      og.drawImage(c, 8, 6, 55, 60);
      return out.toDataURL();
    }
    const SPR_URL = { xun: drawSprite("xun"), npc: drawSprite("npc"), gpu: drawSprite("gpu") };

    function alive() { return state.rivals.filter((r) => !r.out); }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function fmt(n) { return "$" + n.toFixed(2); }

    function drawSpark() {
      const c = $("spark");
      const g = c.getContext("2d");
      const w = c.width, h = c.height;
      g.fillStyle = "#040a05";
      g.fillRect(0, 0, w, h);
      const data = state.hist.slice(-18);
      const min = Math.min.apply(null, data) - 1;
      const max = Math.max.apply(null, data) + 1;
      g.beginPath();
      data.forEach((v, i) => {
        const x = (i / Math.max(1, data.length - 1)) * (w - 4) + 2;
        const y = h - 3 - ((v - min) / (max - min)) * (h - 6);
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      });
      g.strokeStyle = state.stock >= OPEN ? "#76b900" : "#ff6b57";
      g.lineWidth = 2;
      g.stroke();
    }

    function floatAt(text, up, x, y) {
      const el = document.createElement("div");
      el.className = "floater " + (up ? "up" : "down");
      el.textContent = text;
      el.style.left = (x || 40) + "px";
      el.style.top = (y || 70) + "px";
      $("floaters").appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function bumpStock(d, news, silent) {
      const prev = state.stock;
      state.stock = clamp(state.stock + d, 42, 260);
      state.lastDelta = state.stock - prev;
      state.hist.push(state.stock);
      if (state.hist.length > 40) state.hist.shift();
      if (news) state.news = news;
      if (!silent && Math.abs(d) >= 0.4) {
        const hud = $("hud").getBoundingClientRect();
        floatAt((d >= 0 ? "+" : "") + d.toFixed(1), d >= 0, hud.left + 24, hud.top + 28);
        sfx(d >= 0 ? "up" : "down");
        $("price").classList.add("flash");
        setTimeout(() => $("price").classList.remove("flash"), 360);
      }
    }

    function bumpTrust(d) {
      if (!d) return;
      state.trust = clamp(state.trust + d, 0, 100);
      const hud = $("hud").getBoundingClientRect();
      floatAt((d >= 0 ? "印象+" : "印象") + d, d >= 0, hud.left + 160, hud.top + 58);
    }

    function kill(n) {
      if (n <= 0) return [];
      const pool = alive();
      const gone = [];
      const count = Math.min(n, Math.max(0, pool.length - (state.scene === "end" ? 0 : 1)));
      for (let i = 0; i < count; i++) {
        const pick = pool.splice((Math.random() * pool.length) | 0, 1)[0];
        if (!pick) break;
        pick.out = true;
        gone.push(pick.n);
      }
      if (gone.length) {
        sfx("kill");
        const hud = $("hud").getBoundingClientRect();
        floatAt("对手-" + gone.length, true, hud.right - 90, hud.top + 58);
      }
      return gone;
    }

    function paintHud() {
      const p = $("price");
      const d = state.stock - OPEN;
      p.className = "price " + (d >= 0 ? "up" : "down");
      $("delta").textContent = (d >= 0 ? "+" : "") + d.toFixed(2);
      $("price").childNodes[0].textContent = fmt(state.stock) + " ";
      $("rivals").textContent = String(alive().length);
      $("trust").textContent = String(state.trust);
      $("trustBar").style.width = state.trust + "%";
      $("news").textContent = state.news;
      drawSpark();
    }

    function chipsHtml() {
      return '<div class="chips">' + state.rivals.map((r) =>
        '<span class="chip' + (r.out ? " out" : "") + '">' + r.n + "</span>"
      ).join("") + "</div>";
    }

    function render() {
      const sc = STORY[state.scene];
      const stage = $("stage");
      const box = $("choices");
      document.getElementById("frame").classList.toggle("crisis", !!(sc && sc.crisis) || state.crisis);
      if (state.scene === "end") {
        const e = judge();
        $("round").textContent = "结局";
        const info = ENDINGS[e.id];
        stage.innerHTML =
          '<div class="scene-kicker">任命结果</div><h2>' + info.title + "</h2>" +
          '<div class="who"><img class="portrait" alt="" width="72" height="72" src="' + SPR_URL.xun + '" />' +
          '<div class="body">' + info.body + "</div></div>" +
          '<div class="end-box">' +
          '<div class="end-line"><span>收盘价</span><b>' + fmt(state.stock) + "</b></div>" +
          '<div class="end-line"><span>剩余对手</span><b>' + alive().length + "</b></div>" +
          '<div class="end-line"><span>董事会印象</span><b>' + state.trust + "</b></div>" +
          '<div class="score-pop" id="scorePop">0</div></div>' + chipsHtml();
        box.innerHTML = '<button class="go" data-act="restart" type="button">再竞选一次</button>';
        animateScore(e.score);
        sfx(e.good ? "win" : "lose");
        paintHud();
        return;
      }
      $("round").textContent = sc.round || "开局";
      stage.innerHTML =
        '<div class="scene-kicker">' + sc.kicker + "</div>" +
        "<h2>" + (state.scene === "title" ? "" : sc.title) + "</h2>" +
        (state.scene === "title" ? "<h1>" + sc.title + "</h1>" : "") +
        '<div class="who"><img class="portrait" alt="" width="72" height="72" src="' + SPR_URL[sc.who] + '" />' +
        '<div><div class="scene-kicker">' + sc.name + '</div><div class="body">' + sc.body + "</div></div></div>" +
        (sc.hint ? '<div class="hint">' + sc.hint + "</div>" : "") +
        (state.scene === "title" || state.scene === "campus" || state.scene === "final" ? chipsHtml() : "");
      if (state.scene === "title") {
        const h2 = stage.querySelector("h2");
        if (h2) h2.remove();
      }
      box.innerHTML = sc.choices.map((c) =>
        '<button class="choice" data-next="' + c.key + '" type="button"><span class="key">' + c.key + "</span>" + c.text + "</button>"
      ).join("");
      paintHud();
    }

    function judge() {
      const s = state.stock, t = state.trust, c = alive().length;
      const score = Math.round(t * 12 + Math.max(0, s - 90) * 2.2 + (9 - c) * 18);
      if (s < 96) return { id: "crash", score, good: false };
      if (t < 42) return { id: "fail", score, good: false };
      if (c >= 5) return { id: "stolen", score, good: false };
      if (t >= 74 && s >= 132 && c <= 2) return { id: "ceo", score, good: true };
      if (s >= 168 && t >= 55) return { id: "bubble", score, good: true };
      if (s < 120 && t >= 58 && c <= 3) return { id: "crisis_ceo", score, good: true };
      if (t >= 56 && c <= 3) return { id: "almost", score, good: true };
      return { id: "advisor", score, good: false };
    }

    function animateScore(target) {
      const el = $("scorePop");
      if (!el) return;
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 700);
        el.textContent = "得分 " + Math.round(target * k);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function choose(key) {
      const sc = STORY[state.scene];
      if (!sc) return;
      const c = sc.choices.find((x) => x.key === key);
      if (!c) return;
      sfx("click");
      state.crisis = false;
      if (c.trust) bumpTrust(c.trust);
      let stock = c.stock || 0;
      if (c.gamble) stock = Math.random() < 0.5 ? 9.4 : -9.8;
      if (stock) bumpStock(stock, c.news);
      else if (c.news) state.news = c.news;
      const gone = kill(c.kill || 0);
      if (c.letter) state.letter = c.letter;
      if (gone.length) state.news = (c.news || state.news) + " · " + gone.join("、") + " 出局";
      state.sentiment = clamp((state.sentiment || 0) + (stock > 0 ? 0.12 : -0.08), -0.4, 0.35);
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = state.news;
      $("stage").appendChild(toast);
      setTimeout(() => toast.remove(), 900);
      state.scene = c.next;
      if (STORY[state.scene] && STORY[state.scene].crisis) state.crisis = true;
      setTimeout(render, 280);
    }

    function restart() {
      state.scene = "title";
      state.stock = OPEN;
      state.hist = [OPEN, OPEN + 0.2, OPEN];
      state.rivals = NAMES.map((n) => ({ n, out: false }));
      state.trust = 50;
      state.sentiment = 0;
      state.crisis = false;
      state.letter = "";
      state.news = "盘前等待开盘 · 海选通道已打开";
      state.lastDelta = 0;
      render();
    }

    $("choices").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.act === "restart") { sfx("click"); restart(); return; }
      if (btn.dataset.next) choose(btn.dataset.next);
    });
    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (state.scene === "end" && (e.key === "Enter" || e.key === "r" || e.key === "R")) { restart(); return; }
      if (["1", "2", "3"].indexOf(e.key) >= 0) choose(e.key);
      if (e.key === "Enter") {
        const first = document.querySelector("#choices button");
        if (first && first.dataset.next) choose(first.dataset.next);
        if (first && first.dataset.act === "restart") restart();
      }
    });
    $("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted;
      $("muteBtn").textContent = state.muted ? "静音" : "音效";
      if (!state.muted) sfx("click");
    });

    setInterval(() => {
      if (!state.playing) return;
      if (state.scene === "end" || state.scene === "title" || state.scene === "help") {
        bumpStock((Math.random() - 0.48) * 0.35, null, true);
        paintHud();
        return;
      }
      let drift = (Math.random() - 0.5) * 0.7 + (state.sentiment || 0);
      if (state.crisis) drift -= 0.85 + Math.random() * 0.5;
      bumpStock(drift, state.crisis ? "盘前继续往下 · 你还没出手" : null, !state.crisis);
      if (state.crisis) paintHud();
      else paintHud();
    }, 1600);

    try {
      render();
      window.asteamPreview && window.asteamPreview.ready && window.asteamPreview.ready();
    } catch (err) {
      window.asteamPreview && window.asteamPreview.fail && window.asteamPreview.fail(String(err && err.message || err));
    }
  })();
  </script>
</body>
</html>
