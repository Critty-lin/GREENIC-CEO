<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140a" />
  <title>英伟达CEO竞选计</title>
  <style>
    :root {
      --bg: #07140a; --panel: #0c1f10; --ink: #def5c8; --dim: #7fa36a;
      --nv: #76b900; --nv2: #4e7c00; --up: #8dff4a; --down: #ff6b57;
      --gold: #e6c35c; --line: #1d3a18; --btn: #132816;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      overflow: hidden;
    }
    body {
      background-image:
        linear-gradient(rgba(7,20,10,.92), rgba(7,20,10,.92)),
        repeating-linear-gradient(90deg, #0a1c0c 0 12px, #081609 12px 24px);
    }
    button { font-family: inherit; }
    #frame {
      height: 100dvh; height: 100svh; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
      position: relative; overflow: hidden;
    }
    #frame::after {
      content: ""; pointer-events: none; position: absolute; inset: 0; z-index: 8;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px);
    }
    .hud {
      flex: 0 0 auto; border: 3px solid var(--nv); background: #061108;
      padding: 8px 10px 7px; box-shadow: 4px 4px 0 #031006;
    }
    .hud-top { display: flex; align-items: center; gap: 8px; }
    .price-block { min-width: 0; flex: 1; }
    .price-label { font-size: 10px; letter-spacing: .14em; color: var(--nv); }
    .price { font-size: 22px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
    .price.up { color: var(--up); }
    .price.down { color: var(--down); }
    .price.flash { animation: pulse .35s steps(2); }
    .delta { font-size: 12px; margin-left: 4px; }
    #spark { width: 108px; height: 36px; flex: 0 0 auto; image-rendering: pixelated; background: #040a05; border: 2px solid var(--line); }
    .hud-bot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
    .stat b { display: block; color: var(--ink); font-size: 14px; }
    .bar { height: 6px; background: #12210f; border: 1px solid var(--line); margin-top: 3px; }
    .bar > i { display: block; height: 100%; width: 50%; background: var(--nv); }
    .news-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .news { flex: 1; min-width: 0; font-size: 11px; color: var(--nv); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mute, .lock-btn {
      flex: 0 0 auto; min-height: 32px; min-width: 44px; border: 2px solid var(--line);
      background: #061108; color: var(--dim); font-size: 11px; padding: 4px 8px; cursor: pointer;
    }
    .lock-btn { border-color: var(--gold); color: var(--gold); }
    #stage {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      margin: 10px 0 8px; border: 3px solid var(--line); background: var(--panel);
      padding: 12px; position: relative;
    }
    #choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .scene-kicker { font-size: 10px; letter-spacing: .16em; color: var(--gold); }
    h1, h2 { margin: 6px 0 8px; line-height: 1.25; }
    h1 { font-size: 24px; color: var(--nv); text-shadow: 3px 3px 0 #102406; }
    h2 { font-size: 18px; }
    .hero-wrap { display: flex; gap: 12px; align-items: flex-end; margin: 8px 0 12px; }
    .hero {
      image-rendering: pixelated; image-rendering: crisp-edges;
      width: 96px; height: 120px; flex: 0 0 96px;
      background: #08150b; border: 3px solid var(--nv);
    }
    .hero.lg { width: 120px; height: 150px; flex-basis: 120px; }
    .body { font-size: 15px; line-height: 1.55; }
    .hint { margin-top: 8px; color: var(--dim); font-size: 12px; line-height: 1.5; }
    .choice, .go {
      appearance: none; width: 100%; text-align: left; background: var(--btn); color: var(--ink);
      border: 3px solid var(--nv); padding: 12px; min-height: 48px; font-size: 14px; line-height: 1.4;
      cursor: pointer; box-shadow: 3px 3px 0 #031006; overflow-wrap: anywhere; touch-action: manipulation;
    }
    .go { text-align: center; background: #16380c; font-size: 16px; }
    .ghost { background: #0a160c; border-color: var(--line); color: var(--dim); }
    .choice:active, .go:active { transform: translate(2px, 2px); }
    .choice:focus-visible, .go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .key { display: inline-block; min-width: 18px; margin-right: 8px; color: var(--nv); font-weight: 800; }
    .floaters { pointer-events: none; position: fixed; left: 0; top: 0; right: 0; z-index: 12; }
    .floater { position: absolute; font-weight: 800; font-size: 16px; animation: rise .9s steps(8) forwards; text-shadow: 2px 2px 0 #000; }
    .floater.up { color: var(--up); }
    .floater.down { color: var(--down); }
    .toast {
      position: absolute; left: 10px; right: 10px; bottom: 10px; background: #10240c;
      border: 2px solid var(--gold); padding: 8px 10px; font-size: 12px; color: var(--gold); z-index: 4;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip { font-size: 10px; border: 2px solid var(--line); padding: 3px 6px; color: var(--dim); }
    .chip.out { opacity: .35; text-decoration: line-through; }
    .end-line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 2px solid var(--line); }
    .score-pop { font-size: 28px; color: var(--gold); font-weight: 800; margin: 8px 0; }
    .apply {
      background: #0a1408; border: 3px solid #76b900; padding: 12px;
    }
    .apply .brand { color: var(--nv); font-size: 12px; letter-spacing: .2em; }
    .apply .job { font-size: 18px; margin: 6px 0 4px; }
    .apply .meta { color: var(--dim); font-size: 12px; line-height: 1.6; }
    .ok-anim { text-align: center; padding: 18px 8px; }
    .ok-anim .check {
      width: 56px; height: 56px; margin: 0 auto 10px; border: 4px solid var(--nv);
      display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--nv);
      animation: pop .35s steps(3);
    }
    .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--nv); border-right-color: transparent; animation: spin .7s steps(8) infinite; vertical-align: middle; }
    .arena {
      position: relative; height: 168px; overflow: hidden; background: #08150b;
      border: 3px solid var(--line); margin-top: 8px;
    }
    .dm {
      position: absolute; white-space: nowrap; font-size: 12px; padding: 5px 8px;
      border: 2px solid var(--nv); background: #10240c; color: var(--ink); cursor: pointer;
      max-width: 86%; overflow: hidden; text-overflow: ellipsis;
    }
    .dm.trap { border-color: var(--down); color: #ffc8c0; }
    .dm.hit { background: var(--nv); color: #08150b; }
    .dm.miss { background: var(--down); color: #fff; }
    .quote-bar { margin-top: 8px; font-size: 12px; color: var(--gold); }
    .track { position: relative; height: 36px; background: #08150b; border: 3px solid var(--line); overflow: hidden; margin: 12px 0 8px; }
    .zone { position: absolute; top: 0; bottom: 0; background: rgba(118,185,0,.38); }
    .needle { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--gold); }
    .seq { font-size: 22px; text-align: center; color: var(--nv); min-height: 40px; margin: 12px 0; letter-spacing: .08em; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mem {
      min-height: 48px; border: 3px solid var(--nv); background: var(--btn); color: var(--ink);
      font-size: 14px; cursor: pointer;
    }
    .faces { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .face {
      border: 3px solid var(--line); background: #10240c; padding: 10px; min-height: 64px;
      text-align: left; color: var(--ink); cursor: pointer; font-size: 13px;
    }
    .face.on { border-color: var(--nv); }
    .face.lock { border-color: var(--gold); color: var(--gold); }
    .face.dead { opacity: .4; pointer-events: none; }
    .candles { position: relative; height: 150px; overflow: hidden; background: #08150b; border: 3px solid var(--line); margin-top: 8px; }
    .cndl {
      position: absolute; width: 22px; cursor: pointer; border: 2px solid #000;
    }
    .cndl.red { background: var(--down); }
    .cndl.green { background: var(--nv); }
    #overlay {
      position: absolute; inset: 0; z-index: 9; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(0,0,0,.72);
    }
    #overlay.on { display: flex; }
    .modal { width: 100%; }
    .sheet {
      width: 100%; background: #0c1a0c; border: 3px solid var(--gold); padding: 14px;
      box-shadow: 6px 6px 0 #031006;
    }
    .sheet h3 { margin: 0 0 8px; color: var(--gold); font-size: 16px; }
    .progress { height: 10px; background: #12210f; border: 2px solid var(--line); margin: 10px 0; }
    .progress > i { display: block; height: 100%; width: 0; background: var(--gold); }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
    @keyframes pop { from { transform: scale(.4); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-width: 800px) {
      #frame {
        margin-top: 18px; height: calc(100dvh - 36px); border: 4px solid #1a3d12;
        box-shadow: 0 0 0 8px #040a05, 12px 12px 0 #031006;
      }
    }
    @media (max-height: 700px) {
      .hero { width: 72px; height: 90px; flex-basis: 72px; }
      .hero.lg { width: 88px; height: 110px; flex-basis: 88px; }
      h1 { font-size: 20px; }
      .body { font-size: 14px; }
      .arena, .candles { height: 132px; }
      .price { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .price.flash, .floater, .ok-anim .check, .spin { animation: none; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <header class="hud" id="hud">
      <div class="hud-top">
        <div class="price-block">
          <div class="price-label">NVDA 现价</div>
          <div class="price" id="price">$138.40 <span class="delta" id="delta">+0.00</span></div>
        </div>
        <canvas id="spark" width="108" height="36" aria-hidden="true"></canvas>
      </div>
      <div class="hud-bot">
        <div class="stat">对手剩余<b id="rivals">9</b></div>
        <div class="stat">董事会印象<b id="trust">50</b><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat">进度<b id="round">开局</b></div>
      </div>
      <div class="news-row">
        <div class="news" id="news">盘前等待开盘</div>
        <button class="lock-btn" id="lockBtn" type="button" hidden>弱点 ¥</button>
        <button class="mute" id="muteBtn" type="button">音效</button>
      </div>
    </header>
    <main id="stage"></main>
    <div id="choices"></div>
    <div id="overlay"></div>
  </div>
  <div class="floaters" id="floaters"></div>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const OPEN = 138.4;
    const NAMES = ["Max", "Lisa", "Kai", "林博", "Rex", "Nova", "钱总", "Cloud", "匿名"];
    const HERO = [
      "....111111......",
      "...11111111.....",
      "..1122222211....",
      "..1232223211....",
      "..1222122211....",
      "..1222222221....",
      "...12222221.....",
      "....122221......",
      "...14444441.....",
      "..1455555441....",
      ".145555555441...",
      ".145544445541...",
      ".145555555541...",
      ".145555555541...",
      ".144555555441...",
      "..1445555441....",
      "...14444441.....",
      "....14..41......",
      "....14..41......",
      "....11..11......"
    ];
    const HPAL = ["#0000", "#141414", "#f0c090", "#3a2418", "#3d6a00", "#76b900"];

    const QUOTES = [
      { id: "story", text: "让每颗 GPU 自己讲故事", beats: ["pr", "vapor"] },
      { id: "tech", text: "只交 CUDA 优化实录", beats: ["academic", "vapor"] },
      { id: "ambition", text: "我就来当 CEO", beats: ["timid", "finance"] }
    ];
    const DANMAKU = [
      { text: "Max：我管过两家上市公司", type: "pr" },
      { text: "Lisa：内部的人才能碰芯片", type: "insider" },
      { text: "Kai：华尔街要的是纪律", type: "finance" },
      { text: "林博：论文才是护城河", type: "academic" },
      { text: "Rex：堆料就能赢", type: "vapor" },
      { text: "Nova：我上过封面", type: "pr" },
      { text: "钱总：先裁员再谈梦想", type: "finance" },
      { text: "Cloud：云厂商才是未来", type: "vapor" },
      { text: "匿名：我只是来看看", type: "timid" },
      { text: "有人：需求已经见顶", type: "timid" },
      { text: "有人：CUDA 会永远赢", type: "vapor" },
      { text: "有人：把开发者留下就行", type: "academic" }
    ];
    const GOSSIP = [
      { t: "Lisa 说 Kai 在买董事", catch: true },
      { t: "有人夸你简历写得好", catch: false },
      { t: "匿名在散你空降的谣", catch: true },
      { t: "咖啡洒了，纯意外", catch: false },
      { t: "Rex 说你不懂硬件", catch: true }
    ];
    const MEM_POOL = ["CUDA", "供应", "生态", "Blackwell", "交付", "开源"];
    const BOARD = [
      { id: "zhou", name: "周衡", ok: true },
      { id: "lin", name: "林席", ok: true },
      { id: "kai", name: "Kai", ok: false, locked: true },
      { id: "old", name: "老兵席", ok: true }
    ];
    const ENDINGS = {
      quit: { title: "另谋出路", body: "你关掉投递页，去别的公司投了一份普通简历。平平无奇，海选与你无关。" },
      ceo: { title: "你出任 CEO", body: "董事会把钥匙交给 xunxun。对手清场，股价还站得住。" },
      crisis_ceo: { title: "临危受命", body: "股价不好看，但你是还敢把小游戏打完的人。危机交给你。" },
      bubble: { title: "泡沫上的加冕", body: "你坐上了位子，收盘价高得吓人。" },
      stolen: { title: "被对手截胡", body: "名单上还剩太多人。董事会说再看看。" },
      crash: { title: "任命冻结", body: "股价先把房间清空了。" },
      fail: { title: "印象没过线", body: "小游戏打完了，董事会对你的印象没有过线。" },
      almost: { title: "有争议的任命", body: "你出任了，房间里一半人在看股价。" },
      advisor: { title: "顾问席", body: "他们留了你，把 CEO 给了别人。" }
    };

    const state = {
      scene: "title", stock: OPEN, hist: [OPEN, OPEN + 0.2, OPEN],
      rivals: NAMES.map((n) => ({ n, out: false })), trust: 50, sentiment: 0,
      muted: false, news: "盘前等待开盘", quote: null, busy: false,
      pay: "idle", votes: {},
      dm: { items: [], raf: 0, t0: 0, hits: 0, miss: 0, running: false },
      time: { raf: 0, x: 0, t: 0, n: 0, hits: 0, tries: 0, zone: { left: 0.34, width: 0.28 } },
      mem: { seq: [], step: 0, phase: "show" },
      gossip: { i: 0, ok: 0 },
      boardg: { raf: 0, items: [], t0: 0, smash: 0, leak: 0, running: false }
    };

    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, vol) {
      if (state.muted) return;
      try {
        const a = ctx(), o = a.createOscillator(), g = a.createGain();
        o.type = type || "square"; o.frequency.value = freq; g.gain.value = vol || 0.045;
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
      } catch (_) {}
    }
    function sfx(k) {
      if (k === "click") tone(880, 0.06);
      if (k === "up") { tone(440, 0.08); setTimeout(() => tone(659, 0.1), 90); }
      if (k === "down") tone(220, 0.12);
      if (k === "ok") { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.1), i * 80)); }
      if (k === "win") { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.1), i * 90)); }
      if (k === "lose") tone(110, 0.28);
      if (k === "hit") tone(988, 0.05);
    }

    function drawHero() {
      const c = document.createElement("canvas");
      c.width = 16; c.height = 20;
      const g = c.getContext("2d");
      HERO.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
          const ch = row[x];
          if (ch === ".") continue;
          g.fillStyle = HPAL[Number(ch)] || HPAL[1];
          g.fillRect(x, y, 1, 1);
        }
      });
      const out = document.createElement("canvas");
      out.width = 120; out.height = 150;
      const og = out.getContext("2d");
      og.imageSmoothingEnabled = false;
      og.fillStyle = "#08150b";
      og.fillRect(0, 0, 120, 150);
      og.drawImage(c, 0, 0, 16, 16, 12, 12, 96, 126);
      return out.toDataURL();
    }
    const HERO_URL = drawHero();

    function alive() { return state.rivals.filter((r) => !r.out); }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function fmt(n) { return "$" + n.toFixed(2); }
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    function drawSpark() {
      const c = $("spark"), g = c.getContext("2d"), w = c.width, h = c.height;
      g.fillStyle = "#040a05"; g.fillRect(0, 0, w, h);
      const data = state.hist.slice(-18);
      const min = Math.min.apply(null, data) - 1, max = Math.max.apply(null, data) + 1;
      g.beginPath();
      data.forEach((v, i) => {
        const x = (i / Math.max(1, data.length - 1)) * (w - 4) + 2;
        const y = h - 3 - ((v - min) / (max - min)) * (h - 6);
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      });
      g.strokeStyle = state.stock >= OPEN ? "#76b900" : "#ff6b57";
      g.lineWidth = 2; g.stroke();
    }
    function floatAt(text, up, x, y) {
      const el = document.createElement("div");
      el.className = "floater " + (up ? "up" : "down");
      el.textContent = text;
      el.style.left = (x || 40) + "px"; el.style.top = (y || 70) + "px";
      $("floaters").appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
    function bumpStock(d, news, silent) {
      const prev = state.stock;
      state.stock = clamp(state.stock + d, 42, 260);
      state.hist.push(state.stock); if (state.hist.length > 40) state.hist.shift();
      if (news) state.news = news;
      if (!silent && Math.abs(d) >= 0.4) {
        const hud = $("hud").getBoundingClientRect();
        floatAt((d >= 0 ? "+" : "") + d.toFixed(1), d >= 0, hud.left + 24, hud.top + 28);
        sfx(d >= 0 ? "up" : "down");
        $("price").classList.add("flash");
        setTimeout(() => $("price").classList.remove("flash"), 360);
      }
    }
    function bumpTrust(d) {
      if (!d) return;
      state.trust = clamp(state.trust + d, 0, 100);
      const hud = $("hud").getBoundingClientRect();
      floatAt((d >= 0 ? "印象+" : "印象") + d, d >= 0, hud.left + 150, hud.top + 58);
    }
    function kill(n) {
      if (n <= 0) return [];
      const pool = alive(), gone = [];
      const count = Math.min(n, Math.max(0, pool.length - (state.scene === "end" ? 0 : 1)));
      for (let i = 0; i < count; i++) {
        const pick = pool.splice((Math.random() * pool.length) | 0, 1)[0];
        if (!pick) break; pick.out = true; gone.push(pick.n);
      }
      if (gone.length) {
        const hud = $("hud").getBoundingClientRect();
        floatAt("对手-" + gone.length, true, hud.right - 80, hud.top + 58);
      }
      return gone;
    }
    function toast(msg) {
      const old = $("stage").querySelector(".toast"); if (old) old.remove();
      const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
      $("stage").appendChild(el); setTimeout(() => el.remove(), 1200);
    }
    function paintHud() {
      const d = state.stock - OPEN;
      $("price").className = "price " + (d >= 0 ? "up" : "down");
      $("delta").textContent = (d >= 0 ? "+" : "") + d.toFixed(2);
      $("price").childNodes[0].textContent = fmt(state.stock) + " ";
      $("rivals").textContent = String(alive().length);
      $("trust").textContent = String(state.trust);
      $("trustBar").style.width = state.trust + "%";

    function stopLoops() {
      if (state.dm.raf) cancelAnimationFrame(state.dm.raf);

      if (state.boardg.raf) cancelAnimationFrame(state.boardg.raf);
      state.dm.raf = state.time.raf = state.boardg.raf = 0;
      state.dm.running = state.boardg.running = false;

    function settle(opts, next) {
      if (state.busy) return;
      state.busy = true;
      stopLoops();
      if (opts.trust) bumpTrust(opts.trust);
      if (opts.stock) bumpStock(opts.stock, opts.news);
      else if (opts.news) state.news = opts.news;
      const gone = kill(opts.kill || 0);
      if (gone.length) state.news = (opts.news || state.news) + " · " + gone.join("、") + " 出局";
      state.sentiment = clamp(state.sentiment + ((opts.stock || 0) > 0 ? 0.1 : -0.06), -0.4, 0.35);
      toast(state.news);
      state.scene = next;
      setTimeout(() => { state.busy = false; render(); }, 380);
    }

    function judge() {
      if (state.scene === "quitend" || state.quit) return { id: "quit", score: 120, good: false };
      const s = state.stock, t = state.trust, c = alive().length;
      const score = Math.round(t * 12 + Math.max(0, s - 90) * 2.2 + (9 - c) * 18);
      if (s < 96) return { id: "crash", score, good: false };
      if (t < 42) return { id: "fail", score, good: false };
      if (c >= 5) return { id: "stolen", score, good: false };
      if (t >= 74 && s >= 132 && c <= 2) return { id: "ceo", score, good: true };
      if (s >= 168 && t >= 55) return { id: "bubble", score, good: true };
      if (s < 120 && t >= 58 && c <= 3) return { id: "crisis_ceo", score, good: true };
      if (t >= 56 && c <= 3) return { id: "almost", score, good: true };
      return { id: "advisor", score, good: false };
    }

    function showPay() {

      } else if (state.pay === "prank") {

      if (state.pay === "buying") {
        const bar = $("bar");
        let w = 0;
        const t = setInterval(() => {
          w += 14; if (bar) bar.style.width = Math.min(100, w) + "%";
          if (w >= 100) { clearInterval(t); state.pay = "prank"; sfx("ok"); showPay(); }

    function hidePay() {
      const ov = $("overlay"); ov.className = ""; ov.innerHTML = "";
      $("choices").style.visibility = "";
    }

    function animateScore(target) {
      const el = $("scorePop"); if (!el) return;
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 700);
        el.textContent = "得分 " + Math.round(target * k);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function startDanmaku() {
      const arena = $("arena"); if (!arena) return;
      state.dm = { items: [], raf: 0, t0: performance.now(), hits: 0, miss: 0, running: true, spawn: 0 };
      const q = QUOTES.find((x) => x.id === state.quote) || QUOTES[0];
      const spawn = () => {
        if (!state.dm.running) return;
        const src = DANMAKU[(Math.random() * DANMAKU.length) | 0];
        const beat = q.beats.indexOf(src.type) >= 0;
        const el = document.createElement("button");
        el.type = "button";
        el.className = "dm" + (beat ? "" : " trap");
        el.textContent = src.text;
        el.style.top = (8 + Math.random() * 120) + "px";
        el.style.left = "100%";
        el.dataset.beat = beat ? "1" : "0";
        el.addEventListener("click", (ev) => { ev.stopPropagation(); tapDm(el); });
        arena.appendChild(el);
        state.dm.items.push({ el, x: arena.clientWidth, spd: 1.1 + Math.random() * 0.7, beat });
      };
      spawn();
      const loop = (now) => {
        if (!state.dm.running) return;
        if (now - state.dm.spawn > 700) { state.dm.spawn = now; spawn(); }
        const w = arena.clientWidth;
        state.dm.items = state.dm.items.filter((it) => {
          it.x -= it.spd * 1.6;
          it.el.style.left = it.x + "px";
          if (it.x < -it.el.offsetWidth - 8) { it.el.remove(); return false; }
          return true;
        });
        if (now - state.dm.t0 > 12000) { finishDanmaku(); return; }
        state.dm.raf = requestAnimationFrame(loop);
      };
      state.dm.raf = requestAnimationFrame(loop);
    }
    function tapDm(el) {
      if (!state.dm.running || el.dataset.done) return;
      el.dataset.done = "1";
      const beat = el.dataset.beat === "1";
      if (beat) { el.classList.add("hit"); state.dm.hits++; sfx("hit"); bumpTrust(2); bumpStock(0.8, null, true); }
      else { el.classList.add("miss"); state.dm.miss++; sfx("down"); bumpTrust(-2); bumpStock(-1.4, null, true); }
      paintHud();
      setTimeout(() => el.remove(), 180);
    }
    function fireNearest() {
      const arena = $("arena"); if (!arena) return;
      const left = [...arena.querySelectorAll(".dm")].sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left)[0];
      if (left) tapDm(left);
    }
    function finishDanmaku() {
      if (!state.dm.running) return;
      state.dm.running = false;
      const h = state.dm.hits, m = state.dm.miss;
      settle({
        trust: Math.min(10, h * 2) - m, stock: h * 1.2 - m * 1.6, kill: h >= 4 ? 2 : h >= 2 ? 1 : 0,
        news: "海选弹幕 命中" + h + " 点错" + m
      }, "hr");
    }

    function startTiming() {
      state.time = { raf: 0, x: 0, t: Math.random() * 2, n: 0, hits: 0, tries: 0, zone: { left: 0.32, width: 0.3 }, locked: false };
      const zone = $("zone"), needle = $("needle");
      if (zone) { zone.style.left = (state.time.zone.left * 100) + "%"; zone.style.width = (state.time.zone.width * 100) + "%"; }
      const loop = () => {
        if (state.scene !== "hr") return;
        state.time.t += 0.022;
        const x = (Math.sin(state.time.t * 1.7) + 1) / 2;
        state.time.x = x;
        if (needle) needle.style.left = (x * 97) + "%";
        state.time.raf = requestAnimationFrame(loop);
      };
      state.time.raf = requestAnimationFrame(loop);
      updateHrHint();
    }
    function updateHrHint() {
      const el = $("hrHint");
      if (el) el.textContent = "第 " + (state.time.n + 1) + " / 3 次 · 空格或点开口";
    }
    function fireOpen() {
      if (state.scene !== "hr" || state.time.locked) return;
      const z = state.time.zone;
      const hit = state.time.x >= z.left && state.time.x <= z.left + z.width;
      state.time.locked = true;
      if (hit) { state.time.hits++; sfx("hit"); toast("开口打在绿区"); }
      else { sfx("down"); toast("开口偏了"); }
      state.time.n += 1;
      if (state.time.n >= 3) {
        const h = state.time.hits;
        settle({
          trust: h * 5 - (3 - h) * 2, stock: h * 2.2 - (3 - h) * 1.8, kill: h === 3 ? 2 : h >= 2 ? 1 : 0,
          news: "初面开口 " + h + "/3"
        }, "tech");
        return;
      }
      setTimeout(() => { state.time.locked = false; updateHrHint(); }, 280);
    }

    function startMemory() {
      const pool = MEM_POOL.slice();
      const seq = [];
      for (let i = 0; i < 3; i++) seq.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
      state.mem = { seq, step: 0, phase: "show" };
      const seqEl = $("seq"), grid = $("memGrid");
      let i = 0;
      const show = () => {
        if (state.scene !== "tech") return;
        if (i >= seq.length) {
          seqEl.textContent = "按顺序点";
          state.mem.phase = "tap";
          const opts = seq.slice();
          MEM_POOL.forEach((w) => { if (opts.indexOf(w) < 0 && opts.length < 4) opts.push(w); });
          opts.sort(() => Math.random() - 0.5);
          grid.innerHTML = opts.map((w) => '<button class="mem" data-act="mem" data-w="' + w + '" type="button">' + w + "</button>").join("");
          return;
        }
        seqEl.textContent = seq[i];
        i += 1;
        setTimeout(show, 700);
      };
      setTimeout(show, 400);
    }
    function tapMem(w) {
      if (state.mem.phase !== "tap") return;
      const need = state.mem.seq[state.mem.step];
      if (w === need) {
        sfx("hit"); state.mem.step += 1;
        if (state.mem.step >= state.mem.seq.length) {
          settle({ trust: 12, stock: 3.4, kill: 2, news: "二面顺序全对，Arch 点了头" }, "campus");
        }
      } else {
        sfx("down");
        settle({ trust: -4, stock: -2.2, kill: 0, news: "二面顺序乱了，Arch 把杯子放下" }, "campus");
      }
    }

    function gossipAct(catchIt) {
      const g = GOSSIP[state.gossip.i];
      const ok = catchIt === g.catch;
      if (ok) { state.gossip.ok++; sfx("hit"); }
      else sfx("down");
      state.gossip.i += 1;
      if (state.gossip.i >= GOSSIP.length) {
        const h = state.gossip.ok;
        settle({
          trust: h * 3 - (GOSSIP.length - h) * 3, stock: (h - 2) * 1.4, kill: h >= 4 ? 2 : h >= 3 ? 1 : 0,
          news: "职场拆谣 " + h + "/" + GOSSIP.length
        }, "defend");
      } else render();
    }

    function startDefend() {
      const box = $("candles"); if (!box) return;
      state.boardg = { raf: 0, items: [], t0: performance.now(), smash: 0, leak: 0, running: true, spawn: 0 };
      const spawn = () => {
        const red = Math.random() > 0.32;
        const el = document.createElement("button");
        el.type = "button";
        el.className = "cndl " + (red ? "red" : "green");
        el.style.left = (8 + Math.random() * 78) + "%";
        el.style.top = "-30px";
        el.style.height = (18 + Math.random() * 28) + "px";
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (!state.boardg.running) return;
          if (red) { state.boardg.smash++; sfx("hit"); bumpStock(1.1, null, true); }
          else { state.boardg.leak++; sfx("down"); bumpStock(-1.6, null, true); }
          paintHud(); el.remove();
        });
        box.appendChild(el);
        state.boardg.items.push({ el, y: -30, spd: 1.4 + Math.random(), red });
      };
      const loop = (now) => {
        if (!state.boardg.running) return;
        if (now - state.boardg.spawn > 480) { state.boardg.spawn = now; spawn(); }
        const h = box.clientHeight;
        state.boardg.items = state.boardg.items.filter((it) => {
          it.y += it.spd * 1.8;
          it.el.style.top = it.y + "px";
          if (it.y > h) {
            if (it.red) { state.boardg.leak++; bumpStock(-1.2, null, true); paintHud(); }
            it.el.remove(); return false;
          }
          return true;
        });
        if (now - state.boardg.t0 > 8000) { finishDefend(); return; }
        state.boardg.raf = requestAnimationFrame(loop);
      };
      state.boardg.raf = requestAnimationFrame(loop);
    }
    function finishDefend() {
      if (!state.boardg.running) return;
      state.boardg.running = false;
      const s = state.boardg.smash, l = state.boardg.leak;
      settle({
        trust: Math.min(8, s) - Math.min(6, l), stock: s * 0.6, kill: s >= 6 ? 1 : 0,
        news: "护盘 拍红" + s + " 漏" + l
      }, "vote");
    }

    function restart() {
      stopLoops();
      hidePay();
      Object.assign(state, {
        scene: "title", stock: OPEN, hist: [OPEN, OPEN + 0.2, OPEN],
        rivals: NAMES.map((n) => ({ n, out: false })), trust: 50, sentiment: 0,
        news: "盘前等待开盘", quote: null, busy: false, pay: "idle", votes: {}, quit: false
      });
      state.gossip = { i: 0, ok: 0 };
      render();
    }

    $("choices").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const act = b.dataset.act;
      if (act === "restart") { sfx("click"); restart(); return; }
      if (act === "apply" || act === "help") { sfx("click"); state.scene = act === "apply" ? "apply" : "help"; render(); return; }
      if (act === "send") { sfx("click"); state.scene = "sending"; render(); return; }
      if (act === "quitask") {
        sfx("click");
        $("choices").innerHTML = '<button class="go" data-act="apply" type="button">还是投递</button>' +
          '<button class="choice ghost" data-act="quit" type="button">确定放弃</button>';
        toast("放弃将直接结束竞选");
        return;
      }
      if (act === "quit") { sfx("lose"); state.quit = true; state.scene = "quitend"; render(); return; }
      if (act === "quote") { sfx("click"); state.quote = b.dataset.id; state.scene = "danmaku"; render(); return; }
      if (act === "skipdm") { finishDanmaku(); return; }
      if (act === "open") { fireOpen(); return; }
      if (act === "mem") { tapMem(b.dataset.w); return; }
      if (act === "catch") { gossipAct(true); return; }
      if (act === "pass") { gossipAct(false); return; }
      if (act === "vote") {
        const id = b.dataset.id; const info = BOARD.find((x) => x.id === id);
        if (!info || info.locked || state.votes[id]) return;
        sfx("hit"); state.votes[id] = true; bumpTrust(4); bumpStock(1.2, "说动了" + info.name); paintHud(); render();
        return;
      }
      if (act === "pay") {
        if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "没有弱点"); return; }
        sfx("click"); state.pay = "offer"; showPay(); return;
      }
      if (act === "buynow") { sfx("click"); state.pay = "buying"; showPay(); return; }
      if (act === "nopay") { sfx("click"); state.pay = "retain"; showPay(); return; }
      if (act === "giveup") { sfx("down"); state.pay = "lost"; bumpTrust(-2); bumpStock(-2.4, "你失去了价值百亿的机会"); showPay(); return; }
      if (act === "prankok") { state.pay = "pranked"; bumpTrust(1); hidePay(); paintHud(); toast("没有扣款"); if (state.scene === "vote") render(); return; }
      if (act === "lostok") { hidePay(); paintHud(); if (state.scene === "vote") render(); return; }
      if (act === "finish") {
        const n = Object.keys(state.votes).length;
        settle({ trust: n * 2, stock: n * 1.1, kill: n >= 2 ? 1 : 0, news: "表决 说动" + n + " 席" }, "end");
      }
    });
    $("stage").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const act = b.dataset.act;
      if (act === "mem") tapMem(b.dataset.w);
      if (act === "vote" || act === "pay") {
        const ev = new Event("click", { bubbles: true });
        /* reuse choices handler by dispatching through cloning act on choices is messy; call same */
      }
      if (act === "vote") {
        const id = b.dataset.id; const info = BOARD.find((x) => x.id === id);
        if (!info || info.locked || state.votes[id]) return;
        sfx("hit"); state.votes[id] = true; bumpTrust(4); bumpStock(1.2, "说动了" + info.name); render();
      }
      if (act === "pay") {
        if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "没有弱点"); return; }
        sfx("click"); state.pay = "offer"; showPay();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
      if ((state.scene === "end" || state.scene === "quitend") && (e.key === "Enter" || e.key === "r")) { restart(); return; }
      if (state.scene === "title" && e.key === "1") { state.scene = "apply"; render(); return; }
      if (state.scene === "title" && e.key === "2") { state.scene = "help"; render(); return; }
      if (state.scene === "apply" && e.key === "1") { state.scene = "sending"; render(); return; }
      if (state.scene === "apply" && e.key === "2") { document.querySelector("[data-act=quitask]")?.click(); return; }
      if (state.scene === "quote" && "123".indexOf(e.key) >= 0) {
        state.quote = QUOTES[+e.key - 1].id; state.scene = "danmaku"; render(); return;
      }
      if (state.scene === "danmaku" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); fireNearest(); return; }
      if (state.scene === "hr" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); fireOpen(); return; }
      if (state.scene === "campus" && e.key === "1") { gossipAct(true); return; }
      if (state.scene === "campus" && e.key === "2") { gossipAct(false); return; }
    });
    $("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted; $("muteBtn").textContent = state.muted ? "静音" : "音效"; if (!state.muted) sfx("click");
    });
    $("lockBtn").addEventListener("click", () => {
      if (state.pay === "lost" || state.pay === "pranked") { toast(state.pay === "lost" ? "你失去了价值百亿的机会" : "没有弱点"); return; }
      sfx("click"); state.pay = "offer"; showPay();
    });
    $("overlay").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const act = b.dataset.act;
      if (act === "buynow") { sfx("click"); state.pay = "buying"; showPay(); return; }
      if (act === "nopay") { sfx("click"); state.pay = "retain"; showPay(); return; }
      if (act === "giveup") { sfx("down"); state.pay = "lost"; bumpTrust(-2); bumpStock(-2.4, "你失去了价值百亿的机会"); showPay(); return; }
      if (act === "prankok") { state.pay = "pranked"; bumpTrust(1); hidePay(); paintHud(); toast("没有扣款"); if (state.scene === "vote") render(); return; }
      if (act === "lostok") { hidePay(); paintHud(); if (state.scene === "vote") render(); return; }
    });

    setInterval(() => {
      if (state.scene === "end" || state.scene === "quitend" || state.scene === "title" || state.scene === "help" || state.scene === "apply" || state.scene === "sending") {
        bumpStock((Math.random() - 0.48) * 0.3, null, true); paintHud(); return;
      }
      bumpStock((Math.random() - 0.5) * 0.55 + state.sentiment, null, true); paintHud();
    }, 1600);

    try { render(); window.asteamPreview && window.asteamPreview.ready && window.asteamPreview.ready(); }
    catch (err) { window.asteamPreview && window.asteamPreview.fail && window.asteamPreview.fail(String(err && err.message || err)); }
  })();
  </script>
</body>
</html>
