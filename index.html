<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140a" />
  <title>英伟达CEO竞选计</title>
  <style>
    :root {
      --bg: #07140a;
      --panel: #0c1f10;
      --ink: #def5c8;
      --dim: #7fa36a;
      --nv: #76b900;
      --nv2: #4e7c00;
      --up: #8dff4a;
      --down: #ff6b57;
      --gold: #e6c35c;
      --line: #1d3a18;
      --btn: #132816;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      overflow: hidden;
    }
    body {
      background-image:
        linear-gradient(rgba(7,20,10,.92), rgba(7,20,10,.92)),
        repeating-linear-gradient(90deg, #0a1c0c 0 12px, #081609 12px 24px),
        repeating-linear-gradient(0deg, transparent 0 7px, rgba(118,185,0,.05) 7px 8px);
    }
    button, textarea { font-family: inherit; }
    #frame {
      height: 100dvh;
      height: 100svh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
      position: relative;
      overflow: hidden;
    }
    #frame::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px);
      z-index: 8;
    }
    .hud {
      flex: 0 0 auto;
      border: 3px solid var(--nv);
      background: #061108;
      padding: 8px 10px 7px;
      box-shadow: 4px 4px 0 #031006;
    }
    .hud-top { display: flex; align-items: center; gap: 8px; }
    .price-block { min-width: 0; flex: 1; }
    .price-label { font-size: 10px; letter-spacing: .14em; color: var(--nv); }
    .price {
      font-size: 22px; font-weight: 800; letter-spacing: .04em;
      line-height: 1.1; white-space: nowrap;
    }
    .price.up { color: var(--up); }
    .price.down { color: var(--down); }
    .price.flash { animation: pulse .35s steps(2); }
    .delta { font-size: 12px; margin-left: 4px; }
    #spark {
      width: 108px; height: 36px; flex: 0 0 auto;
      image-rendering: pixelated; background: #040a05; border: 2px solid var(--line);
    }
    .hud-bot {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 7px;
      font-size: 11px;
      color: var(--dim);
    }
    .stat b { display: block; color: var(--ink); font-size: 14px; letter-spacing: .03em; }
    .bar { height: 6px; background: #12210f; border: 1px solid var(--line); margin-top: 3px; }
    .bar > i { display: block; height: 100%; width: 50%; background: var(--nv); box-shadow: 4px 0 0 var(--nv2); }
    #stage {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      margin: 10px 0 8px; border: 3px solid var(--line); background: var(--panel);
      padding: 12px 12px 10px; position: relative;
    }
    .scene-kicker { font-size: 10px; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; }
    h1, h2 { margin: 6px 0 8px; line-height: 1.25; }
    h1 { font-size: 26px; color: var(--nv); letter-spacing: .06em; text-shadow: 3px 3px 0 #102406; }
    h2 { font-size: 18px; }
    .who { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0 10px; }
    .portrait {
      width: 72px; height: 72px; flex: 0 0 72px;
      image-rendering: pixelated; background: #08150b; border: 3px solid var(--nv2);
    }
    .body { font-size: 15px; line-height: 1.55; color: var(--ink); }
    .hint { margin-top: 10px; color: var(--dim); font-size: 12px; line-height: 1.5; }
    .crisis #stage { border-color: var(--down); animation: warn 1s steps(2) infinite; }
    #choices { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .choice, .go, .shell, .mute {
      appearance: none; touch-action: manipulation; cursor: pointer;
    }
    .choice, .go {
      width: 100%; text-align: left; background: var(--btn); color: var(--ink);
      border: 3px solid var(--nv); padding: 12px; min-height: 48px;
      font-size: 14px; line-height: 1.4; box-shadow: 3px 3px 0 #031006;
      overflow-wrap: anywhere;
    }
    .go { text-align: center; background: #16380c; font-size: 16px; letter-spacing: .08em; }
    .choice:active, .go:active, .shell:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #031006; }
    .choice:focus-visible, .go:focus-visible, .shell:focus-visible, .weak:focus-visible {
      outline: 3px solid var(--gold); outline-offset: 2px;
    }
    .key { display: inline-block; min-width: 18px; margin-right: 8px; color: var(--nv); font-weight: 800; }
    .ghost { background: #0a160c; border-color: var(--line); color: var(--dim); }
    .news-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .mute {
      flex: 0 0 auto; min-width: 44px; min-height: 32px; border: 2px solid var(--line);
      background: #061108; color: var(--dim); font-size: 11px; padding: 4px 8px;
    }
    .news {
      flex: 1; min-width: 0; font-size: 11px; color: var(--nv);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .floaters { pointer-events: none; position: fixed; left: 0; top: 0; right: 0; z-index: 12; }
    .floater {
      position: absolute; font-weight: 800; font-size: 16px;
      animation: rise .9s steps(8) forwards; text-shadow: 2px 2px 0 #000;
    }
    .floater.up { color: var(--up); }
    .floater.down { color: var(--down); }
    .toast {
      position: absolute; left: 10px; right: 10px; bottom: 10px;
      background: #10240c; border: 2px solid var(--gold); padding: 8px 10px;
      font-size: 12px; color: var(--gold); animation: in .2s steps(2);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip { font-size: 10px; border: 2px solid var(--line); padding: 3px 6px; color: var(--dim); }
    .chip.out { opacity: .35; text-decoration: line-through; }
    .end-box { margin-top: 8px; }
    .end-line { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 2px solid var(--line); }
    .score-pop { font-size: 28px; color: var(--gold); font-weight: 800; margin: 8px 0; }
    .weak {
      display: inline; padding: 0 4px; margin: 0 2px; background: #3a2a00;
      color: var(--gold); border: 2px solid var(--gold); font: inherit; cursor: pointer;
      animation: pulse 1s steps(2) infinite;
    }
    .shell {
      width: 100%; text-align: left; background: #13200c; color: var(--ink);
      border: 3px solid var(--line); padding: 10px 12px; min-height: 44px;
      font-size: 13px; line-height: 1.35; box-shadow: 3px 3px 0 #031006;
    }
    .shell.on { border-color: var(--gold); background: #2a2408; }
    .shell b { color: var(--gold); display: block; font-size: 12px; margin-bottom: 2px; }
    .track {
      position: relative; height: 36px; background: #08150b;
      border: 3px solid var(--line); overflow: hidden; margin: 12px 0 8px;
    }
    .zone {
      position: absolute; top: 0; bottom: 0;
      background: rgba(118, 185, 0, .38);
    }
    .needle {
      position: absolute; top: 0; bottom: 0; width: 4px; background: var(--gold);
      box-shadow: 2px 0 0 #000;
    }
    .talkbox {
      width: 100%; min-height: 88px; resize: none; margin-top: 8px;
      background: #08150b; color: var(--ink); border: 3px solid var(--line);
      padding: 10px; font-size: 16px; line-height: 1.45;
    }
    .mark {
      display: inline-block; margin-top: 8px; padding: 2px 6px;
      border: 2px solid var(--gold); color: var(--gold); font-size: 10px; letter-spacing: .12em;
    }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    @keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
    @keyframes warn { 50% { box-shadow: inset 0 0 0 2px var(--down); } }
    @keyframes in { from { transform: scale(.96); opacity: 0; } }
    @media (min-width: 800px) {
      #frame {
        margin-top: 18px; height: calc(100dvh - 36px);
        border: 4px solid #1a3d12; background: #07140a;
        box-shadow: 0 0 0 8px #040a05, 12px 12px 0 #031006;
      }
      h1 { font-size: 30px; }
    }
    @media (max-width: 430px) {
      .hud-bot { grid-template-columns: 1fr 1fr; }
      .price { font-size: 18px; }
    }
    @media (max-height: 700px) {
      .portrait { width: 56px; height: 56px; flex-basis: 56px; }
      h1 { font-size: 22px; }
      h2 { font-size: 16px; }
      .body { font-size: 14px; }
      .price { font-size: 18px; }
      #spark { width: 88px; height: 30px; }
      .choice, .go { padding: 10px; }
      .talkbox { min-height: 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .price.flash, .crisis #stage, .floater, .toast, .weak { animation: none; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <header class="hud" id="hud">
      <div class="hud-top">
        <div class="price-block">
          <div class="price-label">NVDA 现价</div>
          <div class="price" id="price">$138.40 <span class="delta" id="delta">+0.00</span></div>
        </div>
        <canvas id="spark" width="108" height="36" aria-hidden="true"></canvas>
      </div>
      <div class="hud-bot">
        <div class="stat">对手剩余<b id="rivals">9</b></div>
        <div class="stat">董事会印象<b id="trust">50</b><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat">言弹<b id="ammo">0</b></div>
        <div class="stat">进度<b id="round">开局</b></div>
      </div>
      <div class="news-row">
        <div class="news" id="news">盘前等待开盘 · 海选通道已打开</div>
        <button class="mute" id="muteBtn" type="button" aria-label="音效开关">音效</button>
      </div>
    </header>
    <main id="stage"></main>
    <div id="choices"></div>
  </div>
  <div class="floaters" id="floaters"></div>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const OPEN = 138.4;
    const NAMES = ["Max", "Lisa", "Kai", "林博", "Rex", "Nova", "钱总", "Cloud", "匿名"];
    const SPRITE = {
      xun: "0001111000000112221100012333321001234443210123444431012344443101232223210012111121001111111100110100100",
      npc: "00011110000012222110012333321001235553210123555321012355532101232222310012111121001111111100110100100",
      gpu: "111111111111444444411144000044114404404411440000441144444444114400004411440440441144000044111111111111"
    };
    const PAL = {
      xun: ["#0000", "#1b1b1b", "#f0c090", "#3a2418", "#76b900", "#c8f090"],
      npc: ["#0000", "#222", "#e8d2b0", "#5a3a22", "#76b900", "#3d6ad6"],
      gpu: ["#0000", "#14330a", "#76b900", "#9ae03a", "#0b1a0c"]
    };

    const STORY = {
      title: {
        kicker: "PIXEL CAMPAIGN",
        title: "英伟达CEO竞选计",
        who: "xun",
        name: "xunxun",
        body: "你是 xunxun。英伟达正在海选下一任 CEO。每一轮会抽一种打法：选项、言弹对决、开口时机、或自己打字。三条账一起算：印象、对手、股价。",
        hint: "点选项或按 1 2 3。言弹先选再射高亮那句。开口时机按空格或点按钮。打字也可用现成选项。",

          { key: "1", text: "投递简历", next: "resume" },
          { key: "2", text: "先看怎么玩", next: "help" }

      },
      help: {
        kicker: "怎么玩",
        title: "两条线，四种打法",
        who: "gpu",
        name: "规则",
        body: "叙事和股价一直同时跑。选项会改账；言弹是用前面攒下的证据射对方的破绽；开口时机要在绿区把话甩出去；自己打字由现场阅卷打分。不想打字，随时改用选项。",
        hint: "盘前风暴那轮优先抽开口时机。越晚出手，股价掉得越狠。",
        choices: [{ key: "1", text: "知道了，去投简历", next: "resume" }]
      },
      resume: {

        body: "凌晨 2:17。屏幕上还挂着 9 个公开竞争者。第一封简历会变成后面能射的言弹。",
        choices: [
          { key: "1", text: "写成「我能让每颗 GPU 自己讲故事」", trust: 8, stock: 2.2, kill: 0, news: "市场听到一个会讲故事的新名字", bullet: { id: "story", name: "会讲故事", text: "你把简历写成 GPU 会自己讲故事" } },
          { key: "2", text: "只附 CUDA 优化实录，不写形容词", trust: 12, stock: 0.6, kill: 1, news: "技术派被一份冷冰冰的内核记录震了一下", bullet: { id: "cuda", name: "CUDA 实录", text: "你只附了 CUDA 优化记录，没有形容词" } },

      },
      hr: {
        round: "初面", kicker: "第 1 关 · HR", title: "你为什么现在来", who: "npc", name: "陈招 · HR", next: "crisis",

          { key: "1", text: "我来让公司在下一轮周期活下来", trust: 11, stock: 3.4, kill: 1, news: "「周期」两个字传到买方，买盘抬了一下", bullet: { id: "cycle", name: "下一轮周期", text: "你说自己来让公司活过下一轮周期" } },

          { key: "2", text: "写给股东：利润与纪律", trust: 5, stock: 7.2, kill: 1, news: "纪律两个字让资金先站上你这边", letter: "share" },
          { key: "3", text: "写给员工：下一站更难，我先扛", trust: 10, stock: 0.8, kill: 1, news: "内部士气抬了一下，对手少了一个", letter: "staff" }
        ]

    const DEBATES = {

    const ENDINGS = {

      bubble: { title: "泡沫上的加冕", body: "你坐上了位子，可收盘价高得吓人。门外已经有人在问下一根阴线算谁的。" },

    const HAND_LABEL = { choice: "选项", bullet: "言弹对决", timing: "开口时机", talk: "自己表述" };

    const state = {

      rivals: NAMES.map((n) => ({ n, out: false })),
      trust: 50,
      sentiment: 0,
      crisis: false,
      muted: false,
      playing: true,
      letter: "",
      news: "盘前等待开盘 · 海选通道已打开",
      lastDelta: 0,
      belt: [],
      slots: {},
      sel: -1,
      forceChoice: false,
      busy: false,
      needleX: 0,
      zone: { left: 0.38, width: 0.24 },
      timingRaf: 0,
      timingT: 0,
      timingTries: 0
    };

    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, vol) {
      if (state.muted) return;
      try {
        const a = ctx();
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = type || "square";
        o.frequency.value = freq;
        g.gain.value = vol || 0.045;
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + dur);
      } catch (_) {}
    }
    function sfx(kind) {
      if (kind === "click") tone(880, 0.06);
      if (kind === "up") { tone(440, 0.08); setTimeout(() => tone(554, 0.08), 70); setTimeout(() => tone(659, 0.1), 140); }
      if (kind === "down") { tone(330, 0.08); setTimeout(() => tone(247, 0.1), 80); }
      if (kind === "kill") { tone(196, 0.12, "sawtooth", 0.03); setTimeout(() => tone(98, 0.18, "square", 0.04), 90); }
      if (kind === "win") { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.12), i * 90)); }
      if (kind === "lose") { tone(174, 0.2, "triangle", 0.05); setTimeout(() => tone(110, 0.28), 120); }
      if (kind === "shoot") { tone(988, 0.05); setTimeout(() => tone(1320, 0.08), 50); }
    }

    function drawSprite(kind) {
      const map = SPRITE[kind] || SPRITE.xun;
      const pal = PAL[kind] || PAL.xun;
      const c = document.createElement("canvas");
      c.width = 11; c.height = 14;
      const g = c.getContext("2d");
      for (let i = 0; i < map.length; i++) {
        const ch = map[i];
        if (ch === "0") continue;
        g.fillStyle = pal[Number(ch)] || pal[1];
        g.fillRect(i % 11, (i / 11) | 0, 1, 1);
      }
      const out = document.createElement("canvas");
      out.width = 72; out.height = 72;
      const og = out.getContext("2d");
      og.imageSmoothingEnabled = false;
      og.fillStyle = "#08150b";
      og.fillRect(0, 0, 72, 72);
      og.drawImage(c, 8, 6, 55, 60);
      return out.toDataURL();
    }
    const SPR_URL = { xun: drawSprite("xun"), npc: drawSprite("npc"), gpu: drawSprite("gpu") };

    function alive() { return state.rivals.filter((r) => !r.out); }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function fmt(n) { return "$" + n.toFixed(2); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function planSlots() {
      const s = { hr: "choice", crisis: "timing", tech: "choice", campus: "choice", board: "choice", final: "talk" };
      const spots = ["tech", "campus", "board"];
      const a = spots[(Math.random() * 3) | 0];
      s[a] = "bullet";
      if (Math.random() < 0.34) {
        if (a === "tech") s.board = "bullet";
        else if (a === "board") s.tech = "bullet";
      }
      if (s.tech === "choice" && Math.random() < 0.42) s.tech = "talk";
      if (s.board === "choice" && Math.random() < 0.4) s.board = "timing";
      if (Math.random() < 0.22) s.final = "choice";
      return s;
    }

    function handOf(scene) {
      if (state.forceChoice) return "choice";
      const h = state.slots[scene] || "choice";
      if (h === "bullet" && (!DEBATES[scene] || state.belt.length === 0)) return "choice";
      return h;
    }

    function drawSpark() {
      const c = $("spark");
      const g = c.getContext("2d");
      const w = c.width, h = c.height;
      g.fillStyle = "#040a05";
      g.fillRect(0, 0, w, h);
      const data = state.hist.slice(-18);
      const min = Math.min.apply(null, data) - 1;
      const max = Math.max.apply(null, data) + 1;
      g.beginPath();
      data.forEach((v, i) => {
        const x = (i / Math.max(1, data.length - 1)) * (w - 4) + 2;
        const y = h - 3 - ((v - min) / (max - min)) * (h - 6);
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      });
      g.strokeStyle = state.stock >= OPEN ? "#76b900" : "#ff6b57";
      g.lineWidth = 2;
      g.stroke();
    }

    function floatAt(text, up, x, y) {
      const el = document.createElement("div");
      el.className = "floater " + (up ? "up" : "down");
      el.textContent = text;
      el.style.left = (x || 40) + "px";
      el.style.top = (y || 70) + "px";
      $("floaters").appendChild(el);
      setTimeout(() => el.remove(), 950);
    }

    function bumpStock(d, news, silent) {
      const prev = state.stock;
      state.stock = clamp(state.stock + d, 42, 260);
      state.lastDelta = state.stock - prev;
      state.hist.push(state.stock);
      if (state.hist.length > 40) state.hist.shift();
      if (news) state.news = news;
      if (!silent && Math.abs(d) >= 0.4) {
        const hud = $("hud").getBoundingClientRect();
        floatAt((d >= 0 ? "+" : "") + d.toFixed(1), d >= 0, hud.left + 24, hud.top + 28);
        sfx(d >= 0 ? "up" : "down");
        $("price").classList.add("flash");
        setTimeout(() => $("price").classList.remove("flash"), 360);
      }
    }

    function bumpTrust(d) {
      if (!d) return;
      state.trust = clamp(state.trust + d, 0, 100);
      const hud = $("hud").getBoundingClientRect();
      floatAt((d >= 0 ? "印象+" : "印象") + d, d >= 0, hud.left + 140, hud.top + 58);
    }

    function kill(n) {
      if (n <= 0) return [];
      const pool = alive();
      const gone = [];
      const count = Math.min(n, Math.max(0, pool.length - (state.scene === "end" ? 0 : 1)));
      for (let i = 0; i < count; i++) {
        const pick = pool.splice((Math.random() * pool.length) | 0, 1)[0];
        if (!pick) break;
        pick.out = true;
        gone.push(pick.n);
      }
      if (gone.length) {
        sfx("kill");
        const hud = $("hud").getBoundingClientRect();
        floatAt("对手-" + gone.length, true, hud.right - 90, hud.top + 58);
      }
      return gone;
    }

    function grantBullet(b) {
      if (!b || state.belt.some((x) => x.id === b.id)) return;
      if (state.belt.length >= 6) state.belt.shift();
      state.belt.push(b);
      const hud = $("hud").getBoundingClientRect();
      floatAt("言弹 " + b.name, true, hud.left + 220, hud.top + 70);
    }

    function paintHud() {
      const p = $("price");
      const d = state.stock - OPEN;
      p.className = "price " + (d >= 0 ? "up" : "down");
      $("delta").textContent = (d >= 0 ? "+" : "") + d.toFixed(2);
      $("price").childNodes[0].textContent = fmt(state.stock) + " ";
      $("rivals").textContent = String(alive().length);
      $("trust").textContent = String(state.trust);
      $("trustBar").style.width = state.trust + "%";
      $("ammo").textContent = String(state.belt.length);
      $("news").textContent = state.news;
      drawSpark();
    }

    function chipsHtml() {
      return '<div class="chips">' + state.rivals.map((r) =>
        '<span class="chip' + (r.out ? " out" : "") + '">' + r.n + "</span>"
      ).join("") + "</div>";
    }

    function toast(msg) {
      const old = $("stage").querySelector(".toast");
      if (old) old.remove();
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      $("stage").appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    function stopTiming() {
      if (state.timingRaf) cancelAnimationFrame(state.timingRaf);
      state.timingRaf = 0;
    }

    function startTiming() {
      stopTiming();
      state.timingT = Math.random() * 3;
      state.timingTries = 0;
      state.zone = { left: 0.30 + Math.random() * 0.28, width: 0.18 + Math.random() * 0.08 };
      const zone = document.querySelector(".zone");
      const needle = document.querySelector(".needle");
      if (zone) {
        zone.style.left = (state.zone.left * 100) + "%";
        zone.style.width = (state.zone.width * 100) + "%";
      }
      const step = () => {
        if (handOf(state.scene) !== "timing") return;
        state.timingT += 0.05;
        const x = (Math.sin(state.timingT * 2.6) + 1) / 2;
        state.needleX = x;
        if (needle) needle.style.left = (x * 97) + "%";
        state.timingRaf = requestAnimationFrame(step);
      };
      state.timingRaf = requestAnimationFrame(step);
    }

    function storyHead(sc, extraKicker) {
      const kicker = extraKicker || sc.kicker;
      return '<div class="scene-kicker">' + kicker + "</div>" +
        (state.scene === "title" ? "<h1>" + sc.title + "</h1>" : "<h2>" + sc.title + "</h2>") +
        '<div class="who"><img class="portrait" alt="" width="72" height="72" src="' + SPR_URL[sc.who] + '" />' +
        '<div><div class="scene-kicker">' + sc.name + '</div><div class="body">' + sc.body + "</div></div></div>";
    }

    function render() {
      stopTiming();
      const sc = STORY[state.scene];
      const stage = $("stage");
      const box = $("choices");
      const hand = handOf(state.scene);
      document.getElementById("frame").classList.toggle("crisis", !!(sc && sc.crisis) || state.crisis);
      if (state.scene === "end") {
        const e = judge();
        $("round").textContent = "结局";
        const info = ENDINGS[e.id];
        stage.innerHTML =
          '<div class="scene-kicker">任命结果</div><h2>' + info.title + "</h2>" +
          '<div class="who"><img class="portrait" alt="" width="72" height="72" src="' + SPR_URL.xun + '" />' +
          '<div class="body">' + info.body + "</div></div>" +
          '<div class="end-box">' +
          '<div class="end-line"><span>收盘价</span><b>' + fmt(state.stock) + "</b></div>" +
          '<div class="end-line"><span>剩余对手</span><b>' + alive().length + "</b></div>" +
          '<div class="end-line"><span>董事会印象</span><b>' + state.trust + "</b></div>" +
          '<div class="end-line"><span>言弹</span><b>' + state.belt.length + "</b></div>" +
          '<div class="score-pop" id="scorePop">0</div></div>' + chipsHtml();
        box.innerHTML = '<button class="go" data-act="restart" type="button">再竞选一次</button>';
        animateScore(e.score);
        sfx(e.good ? "win" : "lose");
        paintHud();
        return;
      }
      $("round").textContent = sc.round || "开局";
      if (state.scene === "title" || state.scene === "help" || hand === "choice") {
        stage.innerHTML = storyHead(sc) +
          (sc.hint ? '<div class="hint">' + sc.hint + "</div>" : "") +
          (state.scene === "title" || state.scene === "campus" || state.scene === "final" ? chipsHtml() : "");
        box.innerHTML = sc.choices.map((c) =>
          '<button class="choice" data-next="' + c.key + '" type="button"><span class="key">' + c.key + "</span>" + c.text + "</button>"
        ).join("");
        paintHud();
        return;
      }
      if (hand === "bullet") {
        const d = DEBATES[state.scene];
        if (d && d.grant) grantBullet(d.grant);
        const line = d.line.replace(d.weak, '<button type="button" class="weak" data-act="fire">' + esc(d.weak) + "</button>");
        stage.innerHTML = storyHead(sc, sc.kicker + " · 言弹") +
          '<div class="mark">言弹对决</div>' +
          '<div class="body" style="margin-top:8px">' + d.speaker + "：「" + line + "」</div>" +
          '<div class="hint">先点一枚言弹，再点金色那句或按发射。键盘 1 到 ' + Math.min(9, state.belt.length) + " 选，回车发射。</div>";
        box.innerHTML = state.belt.map((b, i) =>
          '<button class="shell' + (state.sel === i ? " on" : "") + '" data-act="pick" data-i="' + i + '" type="button"><b>' + (i + 1) + " · " + esc(b.name) + "</b>" + esc(b.text) + "</button>"
        ).join("") + '<button class="go" data-act="fire" type="button">发射</button>';
        paintHud();
        return;
      }
      if (hand === "timing") {
        stage.innerHTML = storyHead(sc, sc.kicker + " · 开口") +
          '<div class="mark">开口时机</div>' +
          '<div class="track"><div class="zone"></div><div class="needle"></div></div>' +
          '<div class="hint">针走进绿色窗口时开口。空格或回车也能开口。两次机会。</div>';
        box.innerHTML = '<button class="go" data-act="timing" type="button">开口</button>';
        paintHud();
        startTiming();
        return;
      }
      if (hand === "talk") {
        stage.innerHTML = storyHead(sc, sc.kicker + " · 自己写") +
          '<div class="mark">现场阅卷</div>' +
          '<textarea class="talkbox" id="talk" maxlength="280" placeholder="写你的回答…"></textarea>' +
          '<div class="hint">' + (sc.talkHint || "写完点阅卷。也可以改用现成选项。") + "</div>";
        box.innerHTML =
          '<button class="go" data-act="talk" type="button">提交阅卷</button>' +
          '<button class="choice ghost" data-act="fallback" type="button">改用现成选项</button>';
        paintHud();
        setTimeout(() => { const t = $("talk"); if (t) t.focus(); }, 50);
        return;
      }
    }

    function judge() {
      const s = state.stock, t = state.trust, c = alive().length;
      const score = Math.round(t * 12 + Math.max(0, s - 90) * 2.2 + (9 - c) * 18 + state.belt.length * 6);
      if (s < 96) return { id: "crash", score, good: false };
      if (t < 42) return { id: "fail", score, good: false };
      if (c >= 5) return { id: "stolen", score, good: false };
      if (t >= 74 && s >= 132 && c <= 2) return { id: "ceo", score, good: true };
      if (s >= 168 && t >= 55) return { id: "bubble", score, good: true };
      if (s < 120 && t >= 58 && c <= 3) return { id: "crisis_ceo", score, good: true };
      if (t >= 56 && c <= 3) return { id: "almost", score, good: true };
      return { id: "advisor", score, good: false };
    }

    function animateScore(target) {
      const el = $("scorePop");
      if (!el) return;
      const t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 700);
        el.textContent = "得分 " + Math.round(target * k);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function settle(opts) {
      if (state.busy) return;
      state.busy = true;
      stopTiming();
      state.crisis = false;
      state.forceChoice = false;
      state.sel = -1;
      if (opts.trust) bumpTrust(opts.trust);
      let stock = opts.stock || 0;
      if (opts.gamble) stock = Math.random() < 0.5 ? 9.4 : -9.8;
      if (stock) bumpStock(stock, opts.news);
      else if (opts.news) state.news = opts.news;
      const gone = kill(opts.kill || 0);
      if (opts.letter) state.letter = opts.letter;
      if (opts.bullet) grantBullet(opts.bullet);
      if (gone.length) state.news = (opts.news || state.news) + " · " + gone.join("、") + " 出局";
      state.sentiment = clamp((state.sentiment || 0) + (stock > 0 ? 0.12 : -0.08), -0.4, 0.35);
      toast(state.news);
      const sc = STORY[state.scene];
      state.scene = opts.next || (sc && sc.next) || "end";
      if (STORY[state.scene] && STORY[state.scene].crisis) state.crisis = true;
      setTimeout(() => { state.busy = false; render(); }, 320);
    }

    function choose(key) {
      const sc = STORY[state.scene];
      if (!sc || !sc.choices) return;
      if (state.scene !== "title" && state.scene !== "help" && handOf(state.scene) !== "choice") return;
      const c = sc.choices.find((x) => x.key === key);
      if (!c) return;
      sfx("click");
      settle({
        trust: c.trust, stock: c.stock, kill: c.kill, news: c.news,
        gamble: c.gamble, letter: c.letter, bullet: c.bullet, next: c.next || sc.next
      });
    }

    function selectBullet(i) {
      if (i < 0 || i >= state.belt.length) return;
      state.sel = i;
      sfx("click");
      document.querySelectorAll(".shell").forEach((el, idx) => el.classList.toggle("on", idx === i));
    }

    function fireBullet() {
      if (handOf(state.scene) !== "bullet" || state.busy) return;
      if (state.sel < 0) { toast("先选一枚言弹"); return; }
      const d = DEBATES[state.scene];
      const b = state.belt[state.sel];
      if (!d || !b) return;
      sfx("shoot");
      const hit = d.hit.indexOf(b.id) >= 0;
      if (hit) {
        settle({
          trust: 13, stock: 4.6, kill: 2,
          news: "言弹命中「" + d.weak + "」· 用的是" + b.name
        });
      } else {
        settle({
          trust: -6, stock: -3.1, kill: 0,
          news: b.name + "没打在破绽上，对方把话圆了回去"
        });
      }
    }

    function fireTiming() {
      if (handOf(state.scene) !== "timing" || state.busy) return;
      const z = state.zone;
      const hit = state.needleX >= z.left && state.needleX <= z.left + z.width;
      if (hit) {
        sfx("shoot");
        settle({
          trust: 8, stock: 6.2, kill: 1,
          news: "开口打在绿区，盘口先收了一截",
          bullet: { id: "pulse", name: "低点开口", text: "你在绿区把话甩了出去" }
        });
        return;
      }
      state.timingTries += 1;
      sfx("down");
      if (state.timingTries < 2) {
        toast("没打中，还有一次");
        return;
      }
      settle({
        trust: 1, stock: -4.4, kill: 0,
        news: "开口落在红区，市场把这当成心虚",
        bullet: { id: "silence", name: "开口落空", text: "你两次都没打进绿区" }
      });
    }

    function gradeSpeech(text, scene) {
      const raw = text.replace(/\s+/g, "");
      if (raw.length < 6) {
        return { trust: -5, stock: -1.6, kill: 0, news: "发言太短，现场没当回事", comment: "写太短了。董事会只听到空白。" };
      }
      const packs = {
        tech: {
          good: ["系统", "供应", "生态", "开发者", "CUDA", "cuda", "护城河", "开源", "迁移", "硬件", "软件", "栈", "替代", "第一周", "交付", "算力"],
          bad: ["不可能", "随便", "不知道", "躺"],
          stockW: ["算力", "需求", "交付", "供应"]
        },
        board: {
          good: ["扩产", "算力", "现金流", "几年", "缺口", "加码", "纪律", "坐实", "产线"],
          bad: ["随便", "不知道"],
          stockW: ["现金流", "扩产", "加码", "坐实"]
        },
        final: {
          good: ["开发者", "加速器", "股东", "利润", "纪律", "员工", "团队", "扛", "生态", "现金流", "GPU", "一起", "加速"],
          bad: ["随便", "不知道"],
          stockW: ["利润", "纪律", "股东", "现金流"]
        },
        hr: {
          good: ["周期", "接班", "活下来", "坐实", "董事会"],
          bad: ["随便"],
          stockW: ["周期", "坐实"]
        }
      };
      const pack = packs[scene] || packs.tech;
      const t = text;
      const g = pack.good.filter((w) => t.indexOf(w) >= 0).length;
      const b = pack.bad.filter((w) => t.indexOf(w) >= 0).length;
      const sk = pack.stockW.filter((w) => t.indexOf(w) >= 0).length;
      const trust = clamp(3 + g * 4 - b * 8 + (raw.length > 36 ? 2 : 0), -12, 16);
      const stock = clamp(sk * 2.1 - b * 3 + (g >= 2 ? 1.4 : 0), -6, 8);
      const kill = g >= 3 ? 2 : g >= 1 ? 1 : 0;
      let comment = g >= 3 ? "这句话有骨头，现场有人在记。" : g >= 1 ? "说到点上了，但还薄。" : "听得见声音，抓不住路线。";
      if (b) comment = "有些话把空气弄僵了。";
      let letter = "";
      if (scene === "final") {
        if (t.indexOf("开发者") >= 0 || t.indexOf("加速") >= 0) letter = "dev";
        else if (t.indexOf("股东") >= 0 || t.indexOf("利润") >= 0) letter = "share";
        else if (t.indexOf("员工") >= 0 || t.indexOf("扛") >= 0) letter = "staff";
      }
      return { trust, stock, kill, news: comment, comment, letter };
    }

    function submitTalk() {
      if (handOf(state.scene) !== "talk" || state.busy) return;
      const box = $("talk");
      const text = box ? box.value : "";
      sfx("click");
      const g = gradeSpeech(text, state.scene);
      toast("阅卷中…");
      state.busy = true;
      setTimeout(() => {
        state.busy = false;
        settle({
          trust: g.trust, stock: g.stock, kill: g.kill, news: g.news, letter: g.letter,
          bullet: text.replace(/\s+/g, "").length >= 12 ? { id: "speech-" + state.scene, name: "亲口说的", text: text.slice(0, 28) } : null
        });
      }, 480);
    }

    function restart() {
      stopTiming();
      state.scene = "title";
      state.stock = OPEN;
      state.hist = [OPEN, OPEN + 0.2, OPEN];
      state.rivals = NAMES.map((n) => ({ n, out: false }));
      state.trust = 50;
      state.sentiment = 0;
      state.crisis = false;
      state.letter = "";
      state.news = "盘前等待开盘 · 海选通道已打开";
      state.lastDelta = 0;
      state.belt = [];
      state.slots = {};
      state.sel = -1;
      state.forceChoice = false;
      state.busy = false;
      render();
    }

    function beginRun() {
      state.slots = planSlots();
    }

    $("choices").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === "restart") { sfx("click"); restart(); return; }
      if (act === "pick") { selectBullet(+btn.dataset.i); return; }
      if (act === "fire") { fireBullet(); return; }
      if (act === "timing") { fireTiming(); return; }
      if (act === "talk") { submitTalk(); return; }
      if (act === "fallback") { sfx("click"); state.forceChoice = true; render(); return; }
      if (btn.dataset.next) {
        const sc = STORY[state.scene];
        const c = sc && sc.choices && sc.choices.find((x) => x.key === btn.dataset.next);
        if ((state.scene === "title" || state.scene === "help") && c && c.next === "resume") beginRun();
        choose(btn.dataset.next);
      }
    });
    $("stage").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      if (btn.dataset.act === "fire") fireBullet();
    });
    document.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      const tag = e.target && e.target.tagName;
      if (tag === "TEXTAREA" || tag === "INPUT") {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submitTalk();
        return;
      }
      if (state.scene === "end" && (e.key === "Enter" || e.key === "r" || e.key === "R")) { restart(); return; }
      const hand = handOf(state.scene);
      if (hand === "timing") {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); fireTiming(); }
        return;
      }
      if (hand === "bullet") {
        if ("123456789".indexOf(e.key) >= 0) { selectBullet(+e.key - 1); return; }
        if (e.key === "Enter") { fireBullet(); return; }
        return;
      }
      if (hand === "talk") return;
      if (["1", "2", "3"].indexOf(e.key) >= 0) {
        const sc = STORY[state.scene];
        const c = sc && sc.choices && sc.choices.find((x) => x.key === e.key);
        if ((state.scene === "title" || state.scene === "help") && c && c.next === "resume") beginRun();
        choose(e.key);
      }
      if (e.key === "Enter") {
        const first = document.querySelector("#choices button");
        if (first && first.dataset.next) {
          const sc = STORY[state.scene];
          const c = sc && sc.choices && sc.choices.find((x) => x.key === first.dataset.next);
          if ((state.scene === "title" || state.scene === "help") && c && c.next === "resume") beginRun();
          choose(first.dataset.next);
        }
        if (first && first.dataset.act === "restart") restart();
      }
    });
    $("muteBtn").addEventListener("click", () => {
      state.muted = !state.muted;
      $("muteBtn").textContent = state.muted ? "静音" : "音效";
      if (!state.muted) sfx("click");
    });

    setInterval(() => {
      if (!state.playing) return;
      if (state.scene === "end" || state.scene === "title" || state.scene === "help") {
        bumpStock((Math.random() - 0.48) * 0.35, null, true);
        paintHud();
        return;
      }
      let drift = (Math.random() - 0.5) * 0.7 + (state.sentiment || 0);
      if (state.crisis) drift -= 0.85 + Math.random() * 0.5;
      bumpStock(drift, state.crisis ? "盘前继续往下 · 你还没出手" : null, !state.crisis);
      paintHud();
    }, 1600);

    try {
      render();
      window.asteamPreview && window.asteamPreview.ready && window.asteamPreview.ready();
    } catch (err) {
      window.asteamPreview && window.asteamPreview.fail && window.asteamPreview.fail(String(err && err.message || err));
    }
  })();
  </script>
</body>
</html>
