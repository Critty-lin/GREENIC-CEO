<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%2307140a'/%3E%3Crect%20x='4'%20y='4'%20width='8'%20height='8'%20fill='%2376b900'/%3E%3C/svg%3E" />
  <title>绿色芯片 · 数据复盘</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root { --bg:#07140a; --ink:#def5c8; --dim:#7fa36a; --nv:#76b900; --gold:#e6c35c; --line:#1d3a18; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; padding-bottom: 32px;
      background: #07140a; color: var(--ink);
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    h1 { font-size: 20px; color: var(--nv); margin: 0 0 6px; }
    .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .card { border: 3px solid var(--nv); padding: 10px; background: #0c1f10; }
    .card span { display: block; font-size: 11px; color: var(--dim); }
    .card b { font-size: 22px; color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--line); vertical-align: top; }
    th { color: var(--gold); font-weight: 700; }
    .empty { color: var(--dim); padding: 20px 0; }
    h2 { font-size: 14px; color: var(--gold); margin: 18px 0 4px; }
    .devid { color: var(--dim); font-size: 11px; margin: 0 0 8px; word-break: break-all; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .bar button, .gate-row button {
      appearance: none; font-family: inherit; font-size: 13px; font-weight: 700;
      min-height: 40px; padding: 8px 12px; cursor: pointer;
      background: #16380c; color: var(--ink); border: 3px solid var(--nv);
    }
    .gate {
      max-width: 560px; border: 3px solid var(--gold); background: #0c1f10;
      padding: 16px; margin: 8px 0 20px;
    }
    .gate h2 { margin: 0 0 8px; }
    .gate p { color: var(--dim); font-size: 13px; line-height: 1.6; margin: 0 0 12px; }
    .gate-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .gate-row input {
      flex: 1; min-width: 180px; min-height: 44px; padding: 10px;
      background: #08150b; color: var(--ink); border: 3px solid var(--nv);
      font: inherit; font-weight: 700;
    }
    .gate-row button { min-height: 44px; padding: 10px 16px; }
    .gate-msg { color: var(--gold); font-size: 12px; min-height: 18px; margin-top: 10px; }
    @media (max-width: 640px) {
      .wide { display: none; }
    }
  </style>
</head>
<body>
  <h1>数据复盘</h1>
  <div class="sub">所有走完结局的对局都会记在这里。同一台设备归在一组。刷新本页看最新。不会出现在玩家首页。<br/>这个页面需要访问钥匙；钥匙只保存在当前浏览器会话。表格可用 Excel / WPS 打开，备份是完整账本。</div>

  <div class="gate" id="gate" hidden>
    <h2>需要访问钥匙</h2>
    <p>输入站长设置的访问钥匙后才能查看对局统计。玩家不需要这个页面，游戏和授勋不受影响。</p>
    <div class="gate-row">
      <input id="reviewKey" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="访问钥匙" aria-label="访问钥匙" />
      <button id="btnUnlock" type="button">解锁</button>
    </div>
    <div class="gate-msg" id="gateMsg"></div>
  </div>

  <div id="content" hidden>
    <div class="bar">
      <button type="button" id="btnCsv">导出表格</button>
      <button type="button" id="btnJson">导出备份</button>
      <button type="button" id="btnLock">锁定</button>
    </div>
    <div class="cards" id="cards"></div>
    <div id="table"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const API = String(window.ADVN_API == null ? "" : window.ADVN_API).replace(/\/+$/, "");
    const QUOTE_LABEL = { story: "故事", tech: "技术", ambition: "野心" };
    const KEY_STORE = "advn-review-key";
    function qlabel(q) { return QUOTE_LABEL[q] || q || ""; }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function when(ts) {
      if (!ts) return "—";
      const d = new Date(ts * 1000);
      const p = (n) => (n < 10 ? "0" : "") + n;
      return d.getMonth() + 1 + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function countMap(rows, key) {
      const m = {};
      rows.forEach((r) => { const k = r[key] || "—"; m[k] = (m[k] || 0) + 1; });
      return Object.keys(m).sort((a, b) => m[b] - m[a]).map((k) => k + " " + m[k]).slice(0, 6).join(" · ") || "—";
    }
    function stamp() {
      const d = new Date();
      const p = (n) => (n < 10 ? "0" : "") + n;
      return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
    }
    function saveFile(name, text, type) {
      const blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 800);
    }
    function csvCell(v) {
      const s = String(v == null ? "" : v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    function readKey() { try { return sessionStorage.getItem(KEY_STORE) || ""; } catch (_) { return ""; } }
    function saveKey(k) { try { sessionStorage.setItem(KEY_STORE, k); } catch (_) {} }
    function clearKey() { try { sessionStorage.removeItem(KEY_STORE); } catch (_) {} }

    const gate = document.getElementById("gate");
    const content = document.getElementById("content");
    const keyInput = document.getElementById("reviewKey");
    const gateMsg = document.getElementById("gateMsg");
    let cached = [];

    function setGate(msg) {
      gate.hidden = false;
      content.hidden = true;
      gateMsg.textContent = msg || "";
      keyInput.focus();
    }
    function showContent() {
      gate.hidden = true;
      content.hidden = false;
    }
    async function fetchRows(key) {
      const res = await fetch(API + "/api/runs", {
        cache: "no-store",
        headers: key ? { "X-Review-Key": key } : {}
      });
      if (res.status === 401) {
        const err = new Error("unauthorized");
        err.status = 401;
        throw err;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    function renderRows(input) {
      let rows = Array.isArray(input) ? input : [];
      cached = rows;
      const n = rows.length;
      const avg = (k) => n ? (rows.reduce((s, r) => s + Number(r[k] || 0), 0) / n) : 0;
      const maxs = n ? Math.max.apply(null, rows.map((r) => Number(r.score || 0))) : 0;
      const groups = {};
      rows.forEach((r) => {
        const d = r.device || "unknown";
        if (!groups[d]) groups[d] = [];
        groups[d].push(r);
      });
      const devices = Object.keys(groups);
      document.getElementById("cards").innerHTML =
        '<div class="card"><span>设备数</span><b>' + devices.length + "</b></div>" +
        '<div class="card"><span>总局数</span><b>' + n + "</b></div>" +
        '<div class="card"><span>平均分</span><b>' + Math.round(avg("score")) + "</b></div>" +
        '<div class="card"><span>最高分</span><b>' + maxs + "</b></div>" +
        '<div class="card"><span>平均印象</span><b>' + Math.round(avg("trust")) + "</b></div>" +
        '<div class="card"><span>平均股价</span><b>' + avg("stock").toFixed(1) + "</b></div>";
      const dist = '<div class="sub">结局分布：' + esc(countMap(rows, "ending")) +
        '<br/>宣言分布：' + esc(countMap(rows.map((r) => Object.assign({}, r, { quote: qlabel(r.quote) })), "quote")) + "</div>";
      if (!n) {
        document.getElementById("table").innerHTML = dist + '<div class="empty">还没有人走完全程。</div>';
        return;
      }
      function shortDev(d) {
        if (!d || d === "unknown") return { label: "未知设备", full: "", note: "这批对局记在加上编号之前，没法再拆开" };
        if (d.length <= 10) return { label: "设备 " + d, full: d, note: "编号 " + d };
        return { label: "设备 " + d.slice(0, 4) + "…" + d.slice(-4), full: d, note: "编号 " + d };
      }
      const ordered = devices.sort((a, b) => {
        const ta = Math.max.apply(null, groups[a].map((r) => r.at || 0));
        const tb = Math.max.apply(null, groups[b].map((r) => r.at || 0));
        return tb - ta;
      });
      function tableFor(list) {
        const latest = list.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
        return "<table><thead><tr>" +
          "<th>时间</th><th>结局</th><th>分</th><th>印象</th><th class='wide'>股价</th><th class='wide'>剩余</th><th class='wide'>淘汰</th><th class='wide'>宣言</th>" +
          "</tr></thead><tbody>" + latest.map((r) =>
            "<tr><td>" + when(r.at) + "</td><td>" + esc(r.ending || "") + "</td><td>" + (r.score || 0) +
            "</td><td>" + (r.trust || 0) + "</td><td class='wide'>" + (r.stock || 0) +
            "</td><td class='wide'>" + (r.rivals || 0) + "</td><td class='wide'>" + (r.beaten || 0) +
            "</td><td class='wide'>" + esc(qlabel(r.quote)) + "</td></tr>"
          ).join("") + "</tbody></table>";
      }
      document.getElementById("table").innerHTML = dist + ordered.map((d) => {
        const list = groups[d];
        const best = Math.max.apply(null, list.map((r) => Number(r.score || 0)));
        const info = shortDev(d);
        return "<h2 title=\"" + esc(info.full || info.label) + "\">" + esc(info.label) + " · " + list.length + " 局 · 最好 " + best +
          "</h2><div class=\"devid\">" + esc(info.note) + "</div>" + tableFor(list);
      }).join("");
    }

    async function load(key) {
      try {
        const rows = await fetchRows(key);
        if (key) saveKey(key);
        showContent();
        renderRows(rows);
        return true;
      } catch (err) {
        if (err.status === 401) {
          clearKey();
          setGate(key ? "钥匙不对，再试一次。" : "需要访问钥匙。");
        } else {
          setGate("数据暂时读不到，请稍后再试。");
        }
        return false;
      }
    }

    async function unlock() {
      const key = keyInput.value.trim();
      if (!key) {
        gateMsg.textContent = "请先输入钥匙。";
        return;
      }
      gateMsg.textContent = "验证中…";
      await load(key);
    }

    document.getElementById("btnUnlock").onclick = unlock;
    keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
    document.getElementById("btnLock").onclick = function () {
      clearKey();
      location.reload();
    };
    document.getElementById("btnCsv").onclick = function () {
      const head = ["设备编号", "时间", "结局", "分", "印象", "股价", "剩余对手", "淘汰", "宣言"];
      const lines = [head.join(",")];
      cached.forEach((r) => {
        lines.push([
          r.device || "unknown",
          when(r.at),
          r.ending || "",
          r.score || 0,
          r.trust || 0,
          r.stock || 0,
          r.rivals || 0,
          r.beaten || 0,
          qlabel(r.quote)
        ].map(csvCell).join(","));
      });
      saveFile("绿色芯片对局-" + stamp() + ".csv", "\ufeff" + lines.join("\n"), "text/csv;charset=utf-8");
    };
    document.getElementById("btnJson").onclick = function () {
      saveFile("绿色芯片对局备份-" + stamp() + ".json", JSON.stringify(cached, null, 2), "application/json");
    };

    load(readKey());
  </script>
</body>
</html>
